clear_dtc_history:
  name: Reset DTC Faults & History
  description: Resets active diagnostic trouble code records from the ESP32 and purges event history.

clear_window_pause:
  name: Clear Window Pause
  description: Clears active window pause state and resumes heating on a specific zone or across all zones.
  fields:
    zone_id:
      name: Zone ID
      description: Zone ID (1, 2, or 3) or 0 for all zones.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box

clear_zone_hold:
  name: Resume Schedule (Clear Hold)
  description: Clears manual hold on a zone and returns to scheduled target temperature.
  fields:
    zone_id:
      name: Zone ID
      description: The heating zone ID (1, 2, or 3).
      required: true
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box

submit_gas_meter_reading:
  name: Submit Gas Meter Reading
  description: Records a new physical gas meter index reading for consumption calibration.
  fields:
    index:
      name: Meter Index
      description: Current cumulative gas meter reading in m3.
      required: true
      selector:
        number:
          min: 0.0
          max: 999999.0
          step: 0.001
          mode: box
    time:
      name: Epoch Timestamp
      description: Optional unix timestamp of when the reading was taken.
      required: false
      selector:
        number:
          min: 1700000000
          max: 2000000000
          step: 1
          mode: box

set_zone_boost:
  name: Set Zone Boost
  description: Applies a temporary temperature boost (0.5 to 2.0°C above schedule) to a zone.
  fields:
    zone_id:
      name: Zone ID
      description: The heating zone ID (1, 2, or 3).
      required: true
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box
    boost_temp:
      name: Boost Temperature
      description: Target temperature in °C.
      required: true
      selector:
        number:
          min: 15.0
          max: 28.0
          step: 0.5
          mode: box
