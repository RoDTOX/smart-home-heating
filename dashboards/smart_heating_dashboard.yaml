# Smart Heating - Home Assistant Dashboard
# Theme: Smart Heating (Glassmorphism & Frosted Glass Specification)
# Ergonomic 3-Column Layout without unnecessary scrolling or grey-out glitches

title: Smart Heating
views:
  - title: Panou Principal
    path: acasa
    icon: mdi:radiator
    theme: smart_heating
    type: sections
    max_columns: 3
    badges:
      - entity: sensor.smart_heating_controller_outdoor_temperature
        icon: mdi:weather-partly-cloudy
      - entity: binary_sensor.smart_heating_controller_boiler_demand
        icon: mdi:fire
      - entity: sensor.smart_heating_controller_active_dtc_fault_count
        icon: mdi:shield-check

    sections:
      # ========================================================================
      # COLOANA 1: CENTRALĂ, REGLAJ SEZON & CONSUM GAZ
      # ========================================================================
      - title: Centrală & Energie
        cards:
          # STATUS CENTRALĂ TERMICĂ (VIZUAL FLACĂRĂ / STANDBY)
          - type: custom:mushroom-template-card
            primary: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                Centrală: Flacără Activă
              {% else %}
                Centrală: Standby (Pregătit)
              {% endif %}
            secondary: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                Arzător în funcțiune • Cerere termică activă
              {% else %}
                Circuite la temperatură • Anti-cycling gata
              {% endif %}
            icon: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                mdi:fire
              {% else %}
                mdi:radiator
              {% endif %}
            icon_color: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                amber
              {% else %}
                green
              {% endif %}
            layout: horizontal
            tap_action:
              action: more-info
              entity: binary_sensor.smart_heating_controller_boiler_demand

          # CHIPS METRICI EXTERIOR & TIMP ARDERE (NON-CLICKABLE PENTRU EVITARE GREY-OUT)
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                content: "Exterior: {{ states('sensor.smart_heating_controller_outdoor_temperature') }}°C"
                tap_action: { action: none }
                hold_action: { action: none }
                double_tap_action: { action: none }
              - type: template
                icon: mdi:timer-outline
                icon_color: amber
                content: >-
                  {% set s = states('sensor.smart_heating_controller_boiler_burn_time_today') | float(0) %}
                  {% if s >= 3600 %}
                    Ardere azi: {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m
                  {% else %}
                    Ardere azi: {{ (s / 60) | round(0) | int }} min
                  {% endif %}
                tap_action: { action: none }
                hold_action: { action: none }
                double_tap_action: { action: none }

          # SELECTOR MOD SEZON ÎNCĂLZIRE (MUSHROOM FĂRĂ CASETE ALBE)
          - type: custom:mushroom-select-card
            entity: select.smart_heating_controller_heating_season_mode
            name: "Mod Sezon Încălzire"
            icon: mdi:calendar-sync
            icon_color: amber
            layout: horizontal

          # MOD PLECAT & PROGRAM AUTOMAT
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: entity
                entity: switch.smart_heating_controller_away_mode_plecat
                content_info: name
                icon_color: red
              - type: entity
                entity: switch.smart_heating_controller_schedule_automated_control
                content_info: name
                icon_color: blue

          # CONSUM GAZ & COSTURI
          - type: glance
            title: "Consum Gaz & Costuri"
            show_state: true
            entities:
              - entity: sensor.smart_heating_controller_gas_consumption_today
                name: "Azi (m³)"
                icon: mdi:fire
              - entity: sensor.smart_heating_controller_gas_cost_today
                name: "Cost Azi"
                icon: mdi:cash
              - entity: sensor.smart_heating_controller_gas_consumption_yesterday
                name: "Ieri (m³)"
                icon: mdi:history
              - entity: sensor.smart_heating_controller_gas_consumption_this_month
                name: "Luna Aceasta"
                icon: mdi:calendar-month
              - entity: sensor.smart_heating_controller_gas_cost_this_month
                name: "Cost Lună"
                icon: mdi:cash-multiple

      # ========================================================================
      # COLOANA 2: ZONELE TERMICE (LIVING, COPII, ADULȚI)
      # ========================================================================
      - title: Zone Termice
        cards:
          # ZONA 1: LIVING + BUCĂTĂRIE
          - type: vertical-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.heating_living_living
                name: "Living + Bucătărie (3 Circuite)"
                icon: mdi:sofa
                hvac_modes: []
                show_temperature_control: true
                collapsible_controls: false
                layout: horizontal
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:valve
                    icon_color: >-
                      {% if is_state('binary_sensor.heating_living_actuator_valve', 'on') %}
                        amber
                      {% else %}
                        grey
                      {% endif %}
                    content: >-
                      Valvă: {% if is_state('binary_sensor.heating_living_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:timer-sand
                    icon_color: amber
                    content: >-
                      {% set s = states('sensor.heating_living_heating_runtime_today') | float(0) %}
                      {% if s >= 3600 %}
                        {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m azi
                      {% else %}
                        {{ (s / 60) | round(0) | int }} min azi
                      {% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: "{{ states('sensor.heating_living_humidity') }}%"
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:bluetooth
                    icon_color: grey
                    content: "{{ states('sensor.heating_living_sensor_battery') }}% • {{ states('sensor.heating_living_sensor_ble_signal') }} dBm"
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  # CHIP CONDIȚIONAT: APARE DOAR DACĂ PAUZA DE GEAM E ACTIVĂ
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.heating_living_window_pause
                        state: "on"
                    chip:
                      type: template
                      icon: mdi:window-open-variant
                      icon_color: red
                      content: "Pauză geam ({{ (state_attr('climate.heating_living_living', 'window_pause_remaining_sec') | int(0) / 60) | round }} min)"
                      tap_action: { action: none }
                      hold_action: { action: none }
                  # CHIP CONDIȚIONAT: REVENIRE LA PROGRAM CÂND E ÎN REGLAJ MANUAL / BOOST
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.heating_living_temperature_boost_active
                        state: "on"
                    chip:
                      type: action
                      icon: mdi:calendar-sync
                      icon_color: amber
                      tap_action:
                        action: call-service
                        service: button.press
                        target:
                          entity_id: button.heating_living_resume_schedule_clear_hold

          # ZONA 2: DORMITOR COPII
          - type: vertical-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.heating_kids_kids
                name: "Dormitor Copii (2 Circuite)"
                icon: mdi:baby-face-outline
                hvac_modes: []
                show_temperature_control: true
                collapsible_controls: false
                layout: horizontal
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:valve
                    icon_color: >-
                      {% if is_state('binary_sensor.heating_kids_actuator_valve', 'on') %}
                        amber
                      {% else %}
                        grey
                      {% endif %}
                    content: >-
                      Valvă: {% if is_state('binary_sensor.heating_kids_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:timer-sand
                    icon_color: amber
                    content: >-
                      {% set s = states('sensor.heating_kids_heating_runtime_today') | float(0) %}
                      {% if s >= 3600 %}
                        {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m azi
                      {% else %}
                        {{ (s / 60) | round(0) | int }} min azi
                      {% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: "{{ states('sensor.heating_kids_humidity') }}%"
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:bluetooth
                    icon_color: grey
                    content: "{{ states('sensor.heating_kids_sensor_battery') }}% • {{ states('sensor.heating_kids_sensor_ble_signal') }} dBm"
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.heating_kids_window_pause
                        state: "on"
                    chip:
                      type: template
                      icon: mdi:window-open-variant
                      icon_color: red
                      content: "Pauză geam ({{ (state_attr('climate.heating_kids_kids', 'window_pause_remaining_sec') | int(0) / 60) | round }} min)"
                      tap_action: { action: none }
                      hold_action: { action: none }
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.heating_kids_temperature_boost_active
                        state: "on"
                    chip:
                      type: action
                      icon: mdi:calendar-sync
                      icon_color: amber
                      tap_action:
                        action: call-service
                        service: button.press
                        target:
                          entity_id: button.heating_kids_resume_schedule_clear_hold

          # ZONA 3: DORMITOR MARE
          - type: vertical-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.heating_adults_adults
                name: "Dormitor Mare (2 Circuite)"
                icon: mdi:bed-double-outline
                hvac_modes: []
                show_temperature_control: true
                collapsible_controls: false
                layout: horizontal
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:valve
                    icon_color: >-
                      {% if is_state('binary_sensor.heating_adults_actuator_valve', 'on') %}
                        amber
                      {% else %}
                        grey
                      {% endif %}
                    content: >-
                      Valvă: {% if is_state('binary_sensor.heating_adults_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:timer-sand
                    icon_color: amber
                    content: >-
                      {% set s = states('sensor.heating_adults_heating_runtime_today') | float(0) %}
                      {% if s >= 3600 %}
                        {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m azi
                      {% else %}
                        {{ (s / 60) | round(0) | int }} min azi
                      {% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: "{{ states('sensor.heating_adults_humidity') }}%"
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: template
                    icon: mdi:bluetooth
                    icon_color: grey
                    content: "{{ states('sensor.heating_adults_sensor_battery') }}% • {{ states('sensor.heating_adults_sensor_ble_signal') }} dBm"
                    tap_action: { action: none }
                    hold_action: { action: none }
                    double_tap_action: { action: none }
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.heating_adults_window_pause
                        state: "on"
                    chip:
                      type: template
                      icon: mdi:window-open-variant
                      icon_color: red
                      content: "Pauză geam ({{ (state_attr('climate.heating_adults_adults', 'window_pause_remaining_sec') | int(0) / 60) | round }} min)"
                      tap_action: { action: none }
                      hold_action: { action: none }
                  - type: conditional
                    conditions:
                      - entity: binary_sensor.heating_adults_temperature_boost_active
                        state: "on"
                    chip:
                      type: action
                      icon: mdi:calendar-sync
                      icon_color: amber
                      tap_action:
                        action: call-service
                        service: button.press
                        target:
                          entity_id: button.heating_adults_resume_schedule_clear_hold

      # ========================================================================
      # COLOANA 3: TELEMETRIE 24H & DIAGNOSTIC
      # ========================================================================
      - title: Telemetrie & Diagnostic
        cards:
          # GRAFIC TEMPERATURI & FLACĂRĂ APEXCHARTS 24H (AESTHETIC GRADIENT)
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Evoluție Temperaturi & Flacără (24h)"
              show_states: true
              colorize_states: true
            graph_span: 24h
            all_series_config:
              stroke_width: 2.5
              curve: smooth
            apex_config:
              chart:
                height: 280
              legend:
                show: true
                position: bottom
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
                strokeDashArray: 3
            series:
              - entity: binary_sensor.smart_heating_controller_boiler_demand
                name: "Arzător Activ"
                type: area
                color: "#F59E0B"
                opacity: 0.18
                stroke_width: 0
                transform: "return x === 'on' ? 26 : 12;"
              - entity: sensor.smart_heating_controller_outdoor_temperature
                name: "Exterior"
                color: "#94A3B8"
                stroke_width: 1.5
                type: line
              - entity: climate.heating_living_living
                attribute: current_temperature
                name: "Living"
                color: "#F59E0B"
                type: line
              - entity: climate.heating_kids_kids
                attribute: current_temperature
                name: "Copii"
                color: "#38BDF8"
                type: line
              - entity: climate.heating_adults_adults
                attribute: current_temperature
                name: "Dormitor"
                color: "#10B981"
                type: line

          # STARE TEHNICĂ & DIAGNOSTICARE DTC
          - type: custom:mushroom-template-card
            primary: "Diagnosticare Controller ESP32"
            secondary: >-
              Heap: {{ states('sensor.smart_heating_controller_controller_free_heap') }} KB • 
              Wi-Fi: {{ states('sensor.smart_heating_controller_controller_wi_fi_signal') }} dBm • 
              DTC: {{ states('sensor.smart_heating_controller_active_dtc_fault_count') }} defecte
            icon: >-
              {% if states('sensor.smart_heating_controller_active_dtc_fault_count') | int == 0 %}
                mdi:check-circle-outline
              {% else %}
                mdi:alert-circle-outline
              {% endif %}
            icon_color: >-
              {% if states('sensor.smart_heating_controller_active_dtc_fault_count') | int == 0 %}
                green
              {% else %}
                red
              {% endif %}
            layout: horizontal

          # BUTOANE RAPIDE DE ACȚIUNE TACTILE
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "Resetează DTC"
                secondary: "Golește defecte & log"
                icon: mdi:broom
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.smart_heating_controller_reset_dtc_faults_history
              - type: custom:mushroom-template-card
                primary: "Reia Încălzirea"
                secondary: "Anulează pauze geam"
                icon: mdi:play-circle-outline
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.smart_heating_controller_resume_heating_clear_all_window_pauses
