# Smart Heating - Luxury Wall Tablet Dashboard
# Aesthetic: Skins Pro / Mattias Persson Glassmorphism Architecture
# Full Edge-to-Edge Grid Layout, Architectural Backdrop, Ambient Heating Glow, Tactile Steppers

title: Smart Heating

kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  # ============================================================================
  # TEMPLATE: TASTĂ REGLAJ TEMPERATURĂ (+ / -)
  # ============================================================================
  setpoint_btn:
    show_name: false
    show_state: false
    styles:
      card:
        - width: 42px
        - height: 42px
        - border-radius: 12px
        - background: rgba(255, 255, 255, 0.12)
        - border: 1px solid rgba(255, 255, 255, 0.18)
        - display: flex
        - align-items: center
        - justify-content: center
        - transition: all 0.2s ease
      icon:
        - color: "#ffffff"
        - width: 20px
    tap_action:
      action: call-service
      service: climate.set_temperature
      service_data:
        entity_id: "[[[ return entity.entity_id ]]]"
        temperature: >-
          [[[
            const a = entity.attributes;
            const step = a.target_temp_step || 0.5;
            const current = a.temperature || 21.0;
            const next = current + (variables.dir * step);
            const minT = a.min_temp || 15.0;
            const maxT = a.max_temp || 30.0;
            return Math.min(maxT, Math.max(minT, Math.round(next * 10) / 10));
          ]]]
      haptic: light

  # ============================================================================
  # TEMPLATE: CARD CAMERĂ TERMICĂ (FOTO BACKGROUND + GLOW ACTIV)
  # ============================================================================
  room_tile:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 24px
        - padding: 22px
        - position: relative
        - overflow: hidden
        - backdrop-filter: blur(24px)
        - -webkit-backdrop-filter: blur(24px)
        - transition: all 0.4s ease
        - background: >-
            [[[
              return `linear-gradient(180deg, rgba(15, 23, 42, 0.40) 0%, rgba(15, 23, 42, 0.88) 100%), url('${variables.image}') center / cover no-repeat`;
            ]]]
        - border: >-
            [[[
              const isHeating = states[variables.valve]?.state === 'on';
              return isHeating ? '1px solid rgba(245, 158, 11, 0.65)' : '1px solid rgba(255, 255, 255, 0.14)';
            ]]]
        - box-shadow: >-
            [[[
              const isHeating = states[variables.valve]?.state === 'on';
              return isHeating 
                ? '0 0 35px rgba(245, 158, 11, 0.40), 0 16px 40px rgba(0, 0, 0, 0.50), inset 0 1px 1px rgba(255, 255, 255, 0.30)'
                : '0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.18)';
            ]]]
      grid:
        - grid-template-areas: '"header header" "temp target" "footer footer"'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto auto auto
        - row-gap: 16px
      custom_fields:
        header:
          - display: flex
          - justify-content: space-between
          - align-items: center
        temp:
          - justify-self: start
          - display: flex
          - align-items: baseline
          - gap: 6px
        target:
          - justify-self: end
          - display: flex
          - align-items: center
        footer:
          - display: flex
          - justify-content: space-between
          - align-items: center
          - padding-top: 10px
          - border-top: 1px solid rgba(255, 255, 255, 0.10)
    custom_fields:
      header: >-
        [[[
          const name = variables.name || 'Zonă';
          const icon = variables.icon || 'mdi:home';
          const isHeating = states[variables.valve]?.state === 'on';
          const isOffline = entity.state === 'unavailable';
          
          let badgeText = isHeating ? 'ÎNCĂLZEȘTE' : 'REPAUS';
          let badgeBg = isHeating ? 'rgba(245, 158, 11, 0.25)' : 'rgba(255, 255, 255, 0.10)';
          let badgeColor = isHeating ? '#f59e0b' : 'rgba(255, 255, 255, 0.70)';
          let badgeBorder = isHeating ? '1px solid rgba(245, 158, 11, 0.50)' : '1px solid rgba(255, 255, 255, 0.14)';
          
          if (isOffline) {
            badgeText = 'OFFLINE';
            badgeBg = 'rgba(239, 68, 68, 0.20)';
            badgeColor = '#ef4444';
            badgeBorder = '1px solid rgba(239, 68, 68, 0.40)';
          }
          
          return `
            <div style="display: flex; align-items: center; gap: 10px;">
              <ha-icon icon="${icon}" style="color: #ffffff; --mdc-icon-size: 22px;"></ha-icon>
              <span style="font-size: 17px; font-weight: 600; color: #ffffff; letter-spacing: -0.3px;">${name}</span>
            </div>
            <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px; padding: 4px 10px; border-radius: 20px; background: ${badgeBg}; color: ${badgeColor}; border: ${badgeBorder};">
              ${badgeText}
            </div>
          `;
        ]]]
      temp: >-
        [[[
          const current = entity.attributes.current_temperature;
          const tempStr = current != null ? Number(current).toFixed(1) : '--';
          const hum = states[variables.humidity]?.state;
          const humStr = hum != null ? `${hum}%` : '--%';
          return `
            <span style="font-size: 46px; font-weight: 200; color: #ffffff; letter-spacing: -1.5px; line-height: 1;">${tempStr}°C</span>
            <span style="font-size: 14px; font-weight: 500; color: #38bdf8; margin-left: 8px;">
              <ha-icon icon="mdi:water-percent" style="--mdc-icon-size: 16px;"></ha-icon> ${humStr}
            </span>
          `;
        ]]]
      target:
        card:
          type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action: { action: none }
          styles:
            card:
              - background: rgba(0, 0, 0, 0.30)
              - border: 1px solid rgba(255, 255, 255, 0.12)
              - border-radius: 16px
              - padding: 4px 6px
            grid:
              - grid-template-areas: '"minus val plus"'
              - grid-template-columns: 42px 54px 42px
              - align-items: center
              - justify-items: center
          custom_fields:
            minus:
              card:
                type: custom:button-card
                template: setpoint_btn
                entity: "[[[ return entity.entity_id ]]]"
                icon: mdi:minus
                variables:
                  dir: -1
            val: >-
              [[[
                const target = entity.attributes.temperature;
                const tStr = target != null ? Number(target).toFixed(1) : '--';
                return `<div style="font-size: 16px; font-weight: 700; color: #ffffff; text-align: center;">${tStr}°</div>`;
              ]]]
            plus:
              card:
                type: custom:button-card
                template: setpoint_btn
                entity: "[[[ return entity.entity_id ]]]"
                icon: mdi:plus
                variables:
                  dir: 1
      footer: >-
        [[[
          const runtime = states[variables.runtime]?.state || '0.0';
          const batt = states[variables.battery]?.state || '--';
          const rssi = states[variables.rssi]?.state || '--';
          return `
            <div style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: rgba(255, 255, 255, 0.70);">
              <ha-icon icon="mdi:clock-outline" style="--mdc-icon-size: 15px; color: #94a3b8;"></ha-icon>
              <span>${runtime} min azi</span>
            </div>
            <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: rgba(255, 255, 255, 0.70);">
              <span style="display: flex; align-items: center; gap: 4px;">
                <ha-icon icon="mdi:battery" style="--mdc-icon-size: 15px; color: #10b981;"></ha-icon> ${batt}%
              </span>
              <span style="display: flex; align-items: center; gap: 4px;">
                <ha-icon icon="mdi:bluetooth" style="--mdc-icon-size: 15px; color: #38bdf8;"></ha-icon> ${rssi} dBm
              </span>
            </div>
          `;
        ]]]

views:
  - title: Panou Principal
    path: acasa
    icon: mdi:radiator
    type: panel
    theme: smart_heating
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 360px 1fr 390px
          grid-gap: 24px
          padding: 24px
          max-width: 100%
        cards:
          # ====================================================================
          # COLOANA 1: CEAS DIGITAL MARE, STATUS CENTRALĂ, GAZ & COMUTATOARE
          # ====================================================================
          - type: vertical-stack
            cards:
              # CEAS DIGITAL HERO (SINCRONIZAT LIVE PRIN SENSOR.TIME)
              - type: custom:button-card
                entity: sensor.time
                triggers_update:
                  - sensor.time
                  - sensor.smart_heating_controller_outdoor_temperature
                show_icon: false
                show_name: false
                show_state: false
                tap_action: { action: none }
                styles:
                  card:
                    - background: rgba(15, 23, 42, 0.70)
                    - backdrop-filter: blur(24px) saturate(180%)
                    - -webkit-backdrop-filter: blur(24px) saturate(180%)
                    - border-radius: 24px
                    - border: 1px solid rgba(255, 255, 255, 0.15)
                    - box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45)
                    - padding: 24px 22px
                  grid:
                    - grid-template-areas: '"time" "date" "weather"'
                    - grid-template-rows: auto auto auto
                    - justify-items: start
                  custom_fields:
                    time:
                      - font-size: 58px
                      - font-weight: 200
                      - color: "#ffffff"
                      - letter-spacing: "-1.5px"
                      - line-height: "1"
                      - margin-bottom: "6px"
                    date:
                      - font-size: 15px
                      - font-weight: 500
                      - color: "rgba(255, 255, 255, 0.75)"
                      - text-transform: "capitalize"
                      - margin-bottom: "16px"
                    weather:
                      - font-size: 14px
                      - color: "#94a3b8"
                      - display: flex
                      - align-items: center
                      - gap: 8px
                custom_fields:
                  time: >-
                    [[[ 
                      const now = new Date();
                      return now.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
                    ]]]
                  date: >-
                    [[[ 
                      const now = new Date();
                      return now.toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' });
                    ]]]
                  weather: >-
                    [[[ 
                      const temp = states['sensor.smart_heating_controller_outdoor_temperature'] ? states['sensor.smart_heating_controller_outdoor_temperature'].state : '--';
                      return `<ha-icon icon="mdi:weather-partly-cloudy" style="color: #38bdf8; --mdc-icon-size: 20px;"></ha-icon> Exterior: <b>${temp}°C</b>`;
                    ]]]

              # CENTRALĂ TERMICĂ & STARE ARDERE (AMBER GLOW CÂND ESTE ACTIVĂ)
              - type: custom:button-card
                entity: binary_sensor.smart_heating_controller_boiler_demand
                show_name: false
                show_state: false
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 24px
                    - padding: 20px
                    - transition: all 0.4s ease
                    - backdrop-filter: blur(24px)
                    - -webkit-backdrop-filter: blur(24px)
                    - background: >-
                        [[[
                          return entity.state === 'on' 
                            ? 'rgba(245, 158, 11, 0.20)' 
                            : 'rgba(15, 23, 42, 0.70)';
                        ]]]
                    - border: >-
                        [[[
                          return entity.state === 'on' 
                            ? '1px solid rgba(245, 158, 11, 0.65)' 
                            : '1px solid rgba(255, 255, 255, 0.14)';
                        ]]]
                    - box-shadow: >-
                        [[[
                          return entity.state === 'on'
                            ? '0 0 35px rgba(245, 158, 11, 0.40), 0 16px 40px rgba(0, 0, 0, 0.45)'
                            : '0 16px 40px rgba(0, 0, 0, 0.45)';
                        ]]]
                  grid:
                    - grid-template-areas: '"icon title" "icon status"'
                    - grid-template-columns: 50px 1fr
                    - align-items: center
                  custom_fields:
                    icon:
                      - justify-self: center
                    title:
                      - font-size: 16px
                      - font-weight: 600
                      - color: "#ffffff"
                    status:
                      - font-size: 13px
                      - color: "rgba(255, 255, 255, 0.70)"
                custom_fields:
                  icon: >-
                    [[[
                      if (entity.state === 'unavailable') {
                        return `<ha-icon icon="mdi:server-network-off" style="color: #ef4444; --mdc-icon-size: 36px;"></ha-icon>`;
                      }
                      const color = entity.state === 'on' ? '#f59e0b' : '#94a3b8';
                      const icon = entity.state === 'on' ? 'mdi:fire' : 'mdi:radiator';
                      return `<ha-icon icon="${icon}" style="color: ${color}; --mdc-icon-size: 36px;"></ha-icon>`;
                    ]]]
                  title: >-
                    [[[
                      if (entity.state === 'unavailable') return 'Controler Offline';
                      return entity.state === 'on' ? 'Centrală: Ardere Activă' : 'Centrală: Standby (Pregătit)';
                    ]]]
                  status: >-
                    [[[
                      if (entity.state === 'unavailable') return 'Verifică conexiunea ESP32';
                      return entity.state === 'on' ? 'Flacără aprinsă • Încălzire în desfășurare' : 'Circuite la temperatură • Anti-ciclare activ';
                    ]]]

              # CONSUM GAZ & COSTURI ESTIMATE
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_state: false
                tap_action: { action: none }
                styles:
                  card:
                    - background: rgba(15, 23, 42, 0.70)
                    - backdrop-filter: blur(24px) saturate(180%)
                    - -webkit-backdrop-filter: blur(24px) saturate(180%)
                    - border-radius: 24px
                    - border: 1px solid rgba(255, 255, 255, 0.14)
                    - box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45)
                    - padding: 20px
                  grid:
                    - grid-template-areas: '"header" "grid"'
                    - grid-template-rows: auto auto
                    - row-gap: 16px
                  custom_fields:
                    header:
                      - font-size: 16px
                      - font-weight: 600
                      - color: "#ffffff"
                      - display: flex
                      - align-items: center
                      - gap: 8px
                custom_fields:
                  header: >-
                    [[[ return `<ha-icon icon="mdi:fire-circle" style="color: #f59e0b; --mdc-icon-size: 20px;"></ha-icon> Consum Gaz & Costuri`; ]]]
                  grid: >-
                    [[[
                      const m3Today = states['sensor.smart_heating_controller_gas_consumption_today'] ? states['sensor.smart_heating_controller_gas_consumption_today'].state : '--';
                      const costToday = states['sensor.smart_heating_controller_gas_cost_today'] ? states['sensor.smart_heating_controller_gas_cost_today'].state : '--';
                      const m3Yest = states['sensor.smart_heating_controller_gas_consumption_yesterday'] ? states['sensor.smart_heating_controller_gas_consumption_yesterday'].state : '--';
                      const m3Month = states['sensor.smart_heating_controller_gas_consumption_this_month'] ? states['sensor.smart_heating_controller_gas_consumption_this_month'].state : '--';
                      const costMonth = states['sensor.smart_heating_controller_gas_cost_this_month'] ? states['sensor.smart_heating_controller_gas_cost_this_month'].state : '--';
                      
                      return `
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center;">
                          <div style="background: rgba(255, 255, 255, 0.05); padding: 10px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08);">
                            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Azi (m³)</div>
                            <div style="font-size: 14px; font-weight: 700; color: #ffffff;">${m3Today} m³</div>
                          </div>
                          <div style="background: rgba(255, 255, 255, 0.05); padding: 10px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08);">
                            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Cost Azi</div>
                            <div style="font-size: 14px; font-weight: 700; color: #f59e0b;">LEI ${costToday}</div>
                          </div>
                          <div style="background: rgba(255, 255, 255, 0.05); padding: 10px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08);">
                            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Ieri (m³)</div>
                            <div style="font-size: 14px; font-weight: 700; color: #ffffff;">${m3Yest} m³</div>
                          </div>
                          <div style="background: rgba(255, 255, 255, 0.05); padding: 10px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08);">
                            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Luna (LEI)</div>
                            <div style="font-size: 14px; font-weight: 700; color: #f59e0b;">LEI ${costMonth}</div>
                          </div>
                        </div>
                      `;
                    ]]]

              # COMUTATOARE AUTOMATIZARE & MOD PLECAT (AWAY)
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    entity: switch.smart_heating_controller_away_mode_plecat
                    name: Mod Plecat
                    show_state: true
                    tap_action:
                      action: toggle
                    styles:
                      card:
                        - border-radius: 18px
                        - padding: 14px 16px
                        - background: >-
                            [[[ return entity.state === 'on' ? 'rgba(245, 158, 11, 0.25)' : 'rgba(15, 23, 42, 0.70)'; ]]]
                        - border: >-
                            [[[ return entity.state === 'on' ? '1px solid rgba(245, 158, 11, 0.60)' : '1px solid rgba(255, 255, 255, 0.14)'; ]]]
                      icon:
                        - color: >-
                            [[[ return entity.state === 'on' ? '#f59e0b' : 'rgba(255, 255, 255, 0.70)'; ]]]
                      name:
                        - font-size: 13px
                        - font-weight: 600
                        - color: "#ffffff"
                      state:
                        - font-size: 11px
                        - color: "rgba(255, 255, 255, 0.60)"

                  - type: custom:button-card
                    entity: switch.smart_heating_controller_schedule_automated_control
                    name: Orar Automat
                    show_state: true
                    tap_action:
                      action: toggle
                    styles:
                      card:
                        - border-radius: 18px
                        - padding: 14px 16px
                        - background: >-
                            [[[ return entity.state === 'on' ? 'rgba(16, 185, 129, 0.20)' : 'rgba(15, 23, 42, 0.70)'; ]]]
                        - border: >-
                            [[[ return entity.state === 'on' ? '1px solid rgba(16, 185, 129, 0.50)' : '1px solid rgba(255, 255, 255, 0.14)'; ]]]
                      icon:
                        - color: >-
                            [[[ return entity.state === 'on' ? '#10b981' : 'rgba(255, 255, 255, 0.70)'; ]]]
                      name:
                        - font-size: 13px
                        - font-weight: 600
                        - color: "#ffffff"
                      state:
                        - font-size: 11px
                        - color: "rgba(255, 255, 255, 0.60)"

          # ====================================================================
          # COLOANA 2: CAMERE TERMICE CU POZE REALE & BUTOANE TACTILE + / -
          # ====================================================================
          - type: vertical-stack
            cards:
              # ZONA 1: LIVING + BUCĂTĂRIE (3 CIRCUITE)
              - type: custom:button-card
                template: room_tile
                entity: climate.heating_living_living
                variables:
                  name: Living + Bucătărie
                  icon: mdi:sofa
                  image: /local/rooms/living.jpg
                  valve: binary_sensor.heating_living_actuator_valve
                  humidity: sensor.heating_living_humidity
                  battery: sensor.heating_living_sensor_battery
                  rssi: sensor.heating_living_sensor_ble_signal
                  runtime: sensor.heating_living_heating_runtime_today

              # ZONA 2: DORMITOR COPII (2 CIRCUITE)
              - type: custom:button-card
                template: room_tile
                entity: climate.heating_kids_kids
                variables:
                  name: Dormitor Copii
                  icon: mdi:baby-face-outline
                  image: /local/rooms/kids.jpg
                  valve: binary_sensor.heating_kids_actuator_valve
                  humidity: sensor.heating_kids_humidity
                  battery: sensor.heating_kids_sensor_battery
                  rssi: sensor.heating_kids_sensor_ble_signal
                  runtime: sensor.heating_kids_heating_runtime_today

              # ZONA 3: DORMITOR MARE (2 CIRCUITE)
              - type: custom:button-card
                template: room_tile
                entity: climate.heating_adults_adults
                variables:
                  name: Dormitor Mare
                  icon: mdi:bed-double-outline
                  image: /local/rooms/bedroom.jpg
                  valve: binary_sensor.heating_adults_actuator_valve
                  humidity: sensor.heating_adults_humidity
                  battery: sensor.heating_adults_sensor_battery
                  rssi: sensor.heating_adults_sensor_ble_signal
                  runtime: sensor.heating_adults_heating_runtime_today

          # ====================================================================
          # COLOANA 3: TELEMETRIE, GRAFIC 24H & ACȚIUNI DIAGNOSTIC
          # ====================================================================
          - type: vertical-stack
            cards:
              # GRAFIC EVOLUȚIE TEMPERATURI & ARDERE FLACĂRĂ 24H
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: Evoluție Temperaturi & Flacără (24h)
                  show_states: true
                  colorize_states: true
                graph_span: 24h
                theme_mode: dark
                apex_config:
                  chart:
                    height: 260px
                    background: transparent
                    toolbar:
                      show: false
                  legend:
                    show: false
                  stroke:
                    width: 2.2
                    curve: smooth
                  grid:
                    borderColor: "rgba(255, 255, 255, 0.08)"
                  tooltip:
                    theme: dark
                yaxis:
                  - id: temp
                    min: 10
                    max: 30
                    decimals: 1
                    apex_config:
                      labels:
                        style:
                          colors: "rgba(255, 255, 255, 0.50)"
                  - id: flame
                    min: 0
                    max: 1
                    show: false
                series:
                  - entity: binary_sensor.smart_heating_controller_boiler_demand
                    name: Ardere Flacără
                    yaxis_id: flame
                    type: area
                    color: "#f59e0b"
                    opacity: 0.22
                    stroke_width: 0
                    transform: "return x === 'on' ? 1 : 0;"
                  - entity: sensor.smart_heating_controller_outdoor_temperature
                    name: Exterior
                    yaxis_id: temp
                    color: "#94a3b8"
                    stroke_width: 1.8
                  - entity: climate.heating_living_living
                    attribute: current_temperature
                    name: Living
                    yaxis_id: temp
                    color: "#f59e0b"
                  - entity: climate.heating_kids_kids
                    attribute: current_temperature
                    name: Copii
                    yaxis_id: temp
                    color: "#38bdf8"
                  - entity: climate.heating_adults_adults
                    attribute: current_temperature
                    name: Dormitor
                    yaxis_id: temp
                    color: "#10b981"
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.70) !important;
                      backdrop-filter: blur(24px) saturate(180%) !important;
                      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
                      border-radius: 24px !important;
                      border: 1px solid rgba(255, 255, 255, 0.14) !important;
                      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45) !important;
                      padding: 18px !important;
                    }

              # STATUS CONTROLLER ESP32 & TELEMETRIE LIVE
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_state: false
                tap_action: { action: none }
                styles:
                  card:
                    - background: rgba(15, 23, 42, 0.70)
                    - backdrop-filter: blur(24px)
                    - -webkit-backdrop-filter: blur(24px)
                    - border-radius: 20px
                    - border: 1px solid rgba(255, 255, 255, 0.14)
                    - padding: 14px 18px
                custom_fields:
                  info: >-
                    [[[
                      const heap = states['sensor.smart_heating_controller_controller_free_heap'] ? states['sensor.smart_heating_controller_controller_free_heap'].state : '--';
                      const wifi = states['sensor.smart_heating_controller_controller_wi_fi_signal'] ? states['sensor.smart_heating_controller_controller_wi_fi_signal'].state : '--';
                      const dtc = states['sensor.smart_heating_controller_active_dtc_fault_count'] ? states['sensor.smart_heating_controller_active_dtc_fault_count'].state : '0';
                      
                      const dtcColor = dtc === '0' ? '#10b981' : '#ef4444';
                      const dtcText = dtc === '0' ? 'Zero Erori (OK)' : `${dtc} DTC Active!`;
                      
                      return `
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                          <div style="display: flex; align-items: center; gap: 8px;">
                            <ha-icon icon="mdi:chip" style="color: #38bdf8; --mdc-icon-size: 20px;"></ha-icon>
                            <span style="color: #ffffff; font-weight: 500;">ESP32-Relay X4:</span>
                            <span style="color: #94a3b8;">Heap ${heap} KB • Wi-Fi ${wifi} dBm</span>
                          </div>
                          <div style="font-weight: 700; color: ${dtcColor}; display: flex; align-items: center; gap: 4px;">
                            <ha-icon icon="mdi:shield-check" style="--mdc-icon-size: 16px;"></ha-icon> ${dtcText}
                          </div>
                        </div>
                      `;
                    ]]]

