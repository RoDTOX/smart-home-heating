# Smart Heating - Home Assistant Dashboard
# Ergonomic 3-Column Layout, Mobile-Safe Controls, Gas Combined Hourly Graph, Zone Hourly Runtimes & Calibration Hub

title: Smart Heating
views:
  - title: Panou Principal
    path: acasa
    icon: mdi:radiator
    theme: smart_heating
    type: sections
    max_columns: 3
    badges:
      - entity: sensor.smart_heating_controller_outdoor_temperature
        icon: mdi:weather-partly-cloudy
      - entity: binary_sensor.smart_heating_controller_boiler_demand
        icon: mdi:fire
      - entity: sensor.smart_heating_controller_active_dtc_fault_count
        icon: mdi:shield-check

    sections:
      # ========================================================================
      # COLOANA 1: CEAS, VREME CURENTĂ & PROGNOZĂ, CONSUM GAZ CU GRAFIC COMBINAT
      # ========================================================================
      - title: Vreme & Consum Gaz
        cards:
          # VREME CURENTĂ & PROGNOZĂ PENTRU MÂINE
          - type: weather-forecast
            entity: weather.forecast_home
            name: "Vreme & Prognoză"
            show_current: true
            show_forecast: true
            forecast_type: daily

          # CHIP TIMP SISTEM & EXTERIOR
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:clock-outline
                icon_color: blue
                content: "Ora sistem: {{ states('sensor.time') if states('sensor.time') != 'unknown' else now().strftime('%H:%M') }}"
                tap_action: { action: none }
                hold_action: { action: none }
              - type: template
                icon: mdi:thermometer
                icon_color: cyan
                content: "Exterior: {{ states('sensor.smart_heating_controller_outdoor_temperature') }}°C"
                tap_action: { action: none }
                hold_action: { action: none }
              - type: template
                icon: mdi:fire
                icon_color: >-
                  {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                content: >-
                  {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                    Centrală: Flacără Activă
                  {% else %}
                    Centrală: Standby
                  {% endif %}
                tap_action: { action: none }
                hold_action: { action: none }

          # SUMAR FINANCIAR & TIMPI ARDERE
          - type: glance
            title: "Sumar Consum Gaz & Ardere"
            show_state: true
            entities:
              - entity: sensor.smart_heating_controller_gas_consumption_today
                name: "Azi (m³)"
                icon: mdi:fire
              - entity: sensor.smart_heating_controller_gas_cost_today
                name: "Cost Azi"
                icon: mdi:cash
              - entity: sensor.smart_heating_controller_gas_consumption_yesterday
                name: "Ieri (m³)"
                icon: mdi:history
              - entity: sensor.smart_heating_controller_gas_cost_this_month
                name: "Cost Lună"
                icon: mdi:cash-multiple

          # GRAFIC COMBINAT: CONSUM GAZ & BARE ORARE DE FUNCȚIONARE (24H)
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Consum Gaz & Minute Ardere / Oră (24h)"
              show_states: true
              colorize_states: true
            graph_span: 24h
            apex_config:
              chart:
                height: 250
              legend:
                show: true
                position: top
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
            yaxis:
              - id: minutes
                min: 0
                max: 60
                decimals: 0
                apex_config:
                  title:
                    text: "Min / Oră"
                  tickAmount: 3
              - id: gas
                opposite: true
                decimals: 2
                apex_config:
                  title:
                    text: "Gaz m³"
            series:
              # BARE VERTICALE: CÂTE MINUTE A MERS CENTRALA ÎN FIECARE ORĂ (50% = 30 MIN)
              - entity: sensor.smart_heating_controller_boiler_burn_time_today
                name: "Ardere (min/h)"
                type: column
                yaxis_id: minutes
                color: "#F59E0B"
                opacity: 0.75
                group_by:
                  duration: 1h
                  func: diff
                transform: "return Math.max(0, Math.min(60, Math.round(x / 60)));"

              # LINIE: CONSUMUL DE GAZ CUMULAT AZI
              - entity: sensor.smart_heating_controller_gas_consumption_today
                name: "Consum Gaz"
                type: line
                yaxis_id: gas
                color: "#38BDF8"
                stroke_width: 2.5

          # COMUTATOARE AUTOMATIZARE & MOD SEZON
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.smart_heating_controller_away_mode_plecat
                name: "Mod Plecat"
                icon: mdi:home-export-outline
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.smart_heating_controller_schedule_automated_control
                name: "Orar Automat"
                icon: mdi:calendar-clock
                tap_action:
                  action: toggle

      # ========================================================================
      # COLOANA 2: ZONELE TERMICE (FĂRĂ DIAL CIRCULAR - ANTI SCROLL PE MOBIL)
      # ========================================================================
      - title: Zone Termice
        cards:
          # --------------------------------------------------------------------
          # ZONA 1: LIVING + BUCĂTĂRIE (3 CIRCUITE)
          # --------------------------------------------------------------------
          - type: vertical-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.heating_living_living
                name: "Living + Bucătărie (3 Circuite)"
                icon: mdi:sofa
                hvac_modes: []
                show_temperature_control: true
                collapsible_controls: false
                layout: horizontal
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:valve
                    icon_color: >-
                      {% if is_state('binary_sensor.heating_living_actuator_valve', 'on') %}
                        amber
                      {% else %}
                        grey
                      {% endif %}
                    content: >-
                      Valvă: {% if is_state('binary_sensor.heating_living_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: "{{ states('sensor.heating_living_humidity') }}%"
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:timer-sand
                    icon_color: amber
                    content: >-
                      {% set s = states('sensor.heating_living_heating_runtime_today') | float(0) %}
                      {% if s >= 3600 %}
                        {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m azi
                      {% else %}
                        {{ (s / 60) | round(0) | int }} min azi
                      {% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:bluetooth
                    icon_color: grey
                    content: "{{ states('sensor.heating_living_sensor_battery') }}% • {{ states('sensor.heating_living_sensor_ble_signal') }} dBm"
                    tap_action: { action: none }
                    hold_action: { action: none }

              # GRAFIC SPECIFIC LIVING: TIMP ÎNCĂLZIRE PER ORĂ & TEMPERATURĂ
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: "Activitate Încălzire & Temperatură - Living"
                graph_span: 24h
                apex_config:
                  chart:
                    height: 160
                  legend:
                    show: false
                  grid:
                    borderColor: "rgba(255, 255, 255, 0.05)"
                yaxis:
                  - id: minutes
                    min: 0
                    max: 60
                    decimals: 0
                    apex_config:
                      tickAmount: 2
                  - id: temp
                    opposite: true
                    decimals: 1
                series:
                  - entity: sensor.heating_living_heating_runtime_today
                    name: "Încălzire (min/h)"
                    type: column
                    yaxis_id: minutes
                    color: "#F59E0B"
                    opacity: 0.65
                    group_by:
                      duration: 1h
                      func: diff
                    transform: "return Math.max(0, Math.min(60, Math.round(x / 60)));"
                  - entity: climate.heating_living_living
                    attribute: current_temperature
                    name: "Temp Cameră"
                    type: line
                    yaxis_id: temp
                    color: "#F59E0B"
                    stroke_width: 2.2

          # --------------------------------------------------------------------
          # ZONA 2: DORMITOR COPII (2 CIRCUITE)
          # --------------------------------------------------------------------
          - type: vertical-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.heating_kids_kids
                name: "Dormitor Copii (2 Circuite)"
                icon: mdi:baby-face-outline
                hvac_modes: []
                show_temperature_control: true
                collapsible_controls: false
                layout: horizontal
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:valve
                    icon_color: >-
                      {% if is_state('binary_sensor.heating_kids_actuator_valve', 'on') %}
                        amber
                      {% else %}
                        grey
                      {% endif %}
                    content: >-
                      Valvă: {% if is_state('binary_sensor.heating_kids_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: "{{ states('sensor.heating_kids_humidity') }}%"
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:timer-sand
                    icon_color: amber
                    content: >-
                      {% set s = states('sensor.heating_kids_heating_runtime_today') | float(0) %}
                      {% if s >= 3600 %}
                        {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m azi
                      {% else %}
                        {{ (s / 60) | round(0) | int }} min azi
                      {% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:bluetooth
                    icon_color: grey
                    content: "{{ states('sensor.heating_kids_sensor_battery') }}% • {{ states('sensor.heating_kids_sensor_ble_signal') }} dBm"
                    tap_action: { action: none }
                    hold_action: { action: none }

              # GRAFIC SPECIFIC COPII: TIMP ÎNCĂLZIRE PER ORĂ & TEMPERATURĂ
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: "Activitate Încălzire & Temperatură - Copii"
                graph_span: 24h
                apex_config:
                  chart:
                    height: 160
                  legend:
                    show: false
                  grid:
                    borderColor: "rgba(255, 255, 255, 0.05)"
                yaxis:
                  - id: minutes
                    min: 0
                    max: 60
                    decimals: 0
                    apex_config:
                      tickAmount: 2
                  - id: temp
                    opposite: true
                    decimals: 1
                series:
                  - entity: sensor.heating_kids_heating_runtime_today
                    name: "Încălzire (min/h)"
                    type: column
                    yaxis_id: minutes
                    color: "#38BDF8"
                    opacity: 0.65
                    group_by:
                      duration: 1h
                      func: diff
                    transform: "return Math.max(0, Math.min(60, Math.round(x / 60)));"
                  - entity: climate.heating_kids_kids
                    attribute: current_temperature
                    name: "Temp Cameră"
                    type: line
                    yaxis_id: temp
                    color: "#38BDF8"
                    stroke_width: 2.2

          # --------------------------------------------------------------------
          # ZONA 3: DORMITOR MARE (2 CIRCUITE)
          # --------------------------------------------------------------------
          - type: vertical-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.heating_adults_adults
                name: "Dormitor Mare (2 Circuite)"
                icon: mdi:bed-double-outline
                hvac_modes: []
                show_temperature_control: true
                collapsible_controls: false
                layout: horizontal
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:valve
                    icon_color: >-
                      {% if is_state('binary_sensor.heating_adults_actuator_valve', 'on') %}
                        amber
                      {% else %}
                        grey
                      {% endif %}
                    content: >-
                      Valvă: {% if is_state('binary_sensor.heating_adults_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: "{{ states('sensor.heating_adults_humidity') }}%"
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:timer-sand
                    icon_color: amber
                    content: >-
                      {% set s = states('sensor.heating_adults_heating_runtime_today') | float(0) %}
                      {% if s >= 3600 %}
                        {{ (s // 3600) | int }}h {{ ((s % 3600) // 60) | int }}m azi
                      {% else %}
                        {{ (s / 60) | round(0) | int }} min azi
                      {% endif %}
                    tap_action: { action: none }
                    hold_action: { action: none }
                  - type: template
                    icon: mdi:bluetooth
                    icon_color: grey
                    content: "{{ states('sensor.heating_adults_sensor_battery') }}% • {{ states('sensor.heating_adults_sensor_ble_signal') }} dBm"
                    tap_action: { action: none }
                    hold_action: { action: none }

              # GRAFIC SPECIFIC DORMITOR MARE: TIMP ÎNCĂLZIRE PER ORĂ & TEMPERATURĂ
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: "Activitate Încălzire & Temperatură - Dormitor"
                graph_span: 24h
                apex_config:
                  chart:
                    height: 160
                  legend:
                    show: false
                  grid:
                    borderColor: "rgba(255, 255, 255, 0.05)"
                yaxis:
                  - id: minutes
                    min: 0
                    max: 60
                    decimals: 0
                    apex_config:
                      tickAmount: 2
                  - id: temp
                    opposite: true
                    decimals: 1
                series:
                  - entity: sensor.heating_adults_heating_runtime_today
                    name: "Încălzire (min/h)"
                    type: column
                    yaxis_id: minutes
                    color: "#10B981"
                    opacity: 0.65
                    group_by:
                      duration: 1h
                      func: diff
                    transform: "return Math.max(0, Math.min(60, Math.round(x / 60)));"
                  - entity: climate.heating_adults_adults
                    attribute: current_temperature
                    name: "Temp Cameră"
                    type: line
                    yaxis_id: temp
                    color: "#10B981"
                    stroke_width: 2.2

      # ========================================================================
      # COLOANA 3: TELEMETRIE 24H, CARD CALIBRARE / ALGORITMI & STARE SISTEM
      # ========================================================================
      - title: Telemetrie & Calibrare
        cards:
          # GRAFIC TEMPERATURI & FLACĂRĂ APEXCHARTS 24H (TOATE CAMERELE)
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Ultimele 24 h - Toate Camerele"
              show_states: true
              colorize_states: true
            graph_span: 24h
            all_series_config:
              stroke_width: 2.5
              curve: smooth
            apex_config:
              chart:
                height: 250
              legend:
                show: true
                position: bottom
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
            series:
              - entity: binary_sensor.smart_heating_controller_boiler_demand
                name: "Centrală Pornită"
                type: area
                color: "#F59E0B"
                opacity: 0.20
                stroke_width: 0
                transform: "return x === 'on' ? 26 : 12;"
              - entity: sensor.smart_heating_controller_outdoor_temperature
                name: "Afară"
                color: "#94A3B8"
                stroke_width: 1.5
                type: line
              - entity: climate.heating_living_living
                attribute: current_temperature
                name: "Living"
                color: "#F59E0B"
                type: line
              - entity: climate.heating_kids_kids
                attribute: current_temperature
                name: "Copii"
                color: "#38BDF8"
                type: line
              - entity: climate.heating_adults_adults
                attribute: current_temperature
                name: "Dormitor"
                color: "#10B981"
                type: line

          # ====================================================================
          # CARD CALIBRARE & ALGORITM COMPENSARE (EXPLICATIV & CALIBRATOR)
          # ====================================================================
          - type: custom:mushroom-template-card
            primary: "Calibrare & Algoritm Compensare"
            secondary: >-
              {% set out = states('sensor.smart_heating_controller_outdoor_temperature') | float(12.0) %}
              {% if out > 14 %}
                Compensare Meteo: Inactivă (Temp exterioară ridicată • Pierderi minime)
              {% elif out > 6 %}
                Compensare Meteo: Nivel Moderat (Ciclu standard șapă • ~30-45m/ciclu)
              {% else %}
                Compensare Meteo: Nivel Ridicat (Preîncălzire activă • Compensare inerție)
              {% endif %}
            icon: mdi:tune-vertical
            icon_color: cyan
            layout: horizontal

          # REPERE DE CALIBRARE LIVE (NVS & FORMULE ACTIVE PE PLACĂ)
          - type: entities
            title: "Parametri Calibrare Algoritm (Live NVS)"
            show_header_toggle: false
            entities:
              - entity: sensor.smart_heating_controller_outdoor_temperature
                name: "Temp Exterioară (Open-Meteo)"
                icon: mdi:cloud-outline
              - entity: select.smart_heating_controller_heating_season_mode
                name: "Mod Sezon Încălzire"
                icon: mdi:calendar-sync
              - entity: sensor.smart_heating_controller_boiler_cooldown_remaining
                name: "Anti-Scurt-Ciclare Restant (Secunde)"
                icon: mdi:timer-sand
              - type: attribute
                entity: climate.heating_living_living
                attribute: target_temp_step
                name: "Pas Reglaj Temperatură (Hysteresis)"
                icon: mdi:ray-vertex

          # STARE TEHNICĂ & DIAGNOSTICARE DTC
          - type: custom:mushroom-template-card
            primary: "Diagnosticare Controller ESP32"
            secondary: >-
              Heap: {{ (states('sensor.smart_heating_controller_controller_free_heap') | float(0) / 1024) | round(0) }} KB • 
              Wi-Fi: {{ states('sensor.smart_heating_controller_controller_wi_fi_signal') | int }} dBm • 
              DTC: {{ states('sensor.smart_heating_controller_active_dtc_fault_count') | int }} defecte
            icon: >-
              {% if states('sensor.smart_heating_controller_active_dtc_fault_count') | int == 0 %}
                mdi:check-circle-outline
              {% else %}
                mdi:alert-circle-outline
              {% endif %}
            icon_color: >-
              {% if states('sensor.smart_heating_controller_active_dtc_fault_count') | int == 0 %}
                green
              {% else %}
                red
              {% endif %}
            layout: horizontal

          # BUTOANE RAPIDE DE ACȚIUNE TACTILE
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "Resetează DTC"
                secondary: "Golește defecte & log"
                icon: mdi:broom
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.smart_heating_controller_reset_dtc_faults_history
              - type: custom:mushroom-template-card
                primary: "Reia Încălzirea"
                secondary: "Anulează pauze geam"
                icon: mdi:play-circle-outline
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.smart_heating_controller_resume_heating_clear_all_window_pauses
