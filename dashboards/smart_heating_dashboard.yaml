# Smart Heating - Home Assistant Dashboard
# Theme: Smart Heating (Stitch Design Specification)
# Ergonomic 3-Column Layout without unnecessary scrolling

title: Smart Heating
views:
  - title: Panou Principal
    path: acasa
    icon: mdi:radiator
    theme: smart_heating
    type: sections
    max_columns: 3
    badges:
      - entity: sensor.smart_heating_controller_outdoor_temperature
        icon: mdi:weather-partly-cloudy
      - entity: binary_sensor.smart_heating_controller_boiler_demand
        icon: mdi:fire
      - entity: sensor.smart_heating_controller_active_dtc_fault_count
        icon: mdi:check-circle-outline

    sections:
      # ========================================================================
      # COLOANA 1: CENTRALĂ, VREME & CONTOR GAZ
      # ========================================================================
      - title: Centrală & Energie
        cards:
          # STATUS CENTRALĂ TERMICĂ (VIZUAL FLACĂRĂ / STANDBY)
          - type: custom:mushroom-template-card
            primary: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                Centrală: Flacără Activă
              {% else %}
                Centrală: Standby (Pregătit)
              {% endif %}
            secondary: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                Arzător în funcțiune • Cerere activă
              {% else %}
                Circuite la temperatură • Anti-cycling gata
              {% endif %}
            icon: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                mdi:fire
              {% else %}
                mdi:radiator
              {% endif %}
            icon_color: >-
              {% if is_state('binary_sensor.smart_heating_controller_boiler_demand', 'on') %}
                amber
              {% else %}
                green
              {% endif %}
            layout: horizontal
            tap_action:
              action: more-info
              entity: binary_sensor.smart_heating_controller_boiler_demand

          # CHIPS METRICI ARDERE & EXTERIOR
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:weather-partly-cloudy
                icon_color: blue
                content: "Exterior: {{ states('sensor.smart_heating_controller_outdoor_temperature') }}°C"
              - type: template
                icon: mdi:timer-outline
                icon_color: amber
                content: "Ardere azi: {{ states('sensor.smart_heating_controller_boiler_burn_time_today') }} min"

          # CONSUM GAZ & COSTURI
          - type: glance
            title: "Consum Gaz & Costuri"
            show_state: true
            entities:
              - entity: sensor.smart_heating_controller_gas_consumption_today
                name: "Azi (m³)"
                icon: mdi:fire
              - entity: sensor.smart_heating_controller_gas_cost_today
                name: "Cost Azi"
                icon: mdi:cash
              - entity: sensor.smart_heating_controller_gas_consumption_yesterday
                name: "Ieri (m³)"
                icon: mdi:history
              - entity: sensor.smart_heating_controller_gas_consumption_this_month
                name: "Luna Aceasta"
                icon: mdi:calendar-month
              - entity: sensor.smart_heating_controller_gas_cost_this_month
                name: "Cost Lună"
                icon: mdi:cash-multiple

      # ========================================================================
      # COLOANA 2: ZONELE TERMICE (LIVING, COPII, ADULȚI)
      # ========================================================================
      - title: Zone Termice
        cards:
          # ZONA 1: LIVING + BUCĂTĂRIE
          - type: custom:mushroom-climate-card
            entity: climate.heating_living_living
            name: "Living + Bucătărie (3 Circuite)"
            icon: mdi:sofa
            hvac_modes:
              - heat
              - "off"
            show_temperature_control: true
            layout: horizontal

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:valve
                icon_color: >-
                  {% if is_state('binary_sensor.heating_living_actuator_valve', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                content: >-
                  Valvă: {% if is_state('binary_sensor.heating_living_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
              - type: template
                icon: mdi:timer-sand
                icon_color: amber
                content: "{{ states('sensor.heating_living_heating_runtime_today') }} min azi"
              - type: template
                icon: mdi:water-percent
                icon_color: blue
                content: "{{ states('sensor.heating_living_humidity') }}%"
              - type: template
                icon: mdi:battery
                icon_color: green
                content: "{{ states('sensor.heating_living_sensor_battery') }}%"
              - type: template
                icon: mdi:bluetooth
                icon_color: grey
                content: "{{ states('sensor.heating_living_sensor_ble_signal') }} dBm"

          # ZONA 2: DORMITOR COPII
          - type: custom:mushroom-climate-card
            entity: climate.heating_kids_kids
            name: "Dormitor Copii (2 Circuite)"
            icon: mdi:baby-face-outline
            hvac_modes:
              - heat
              - "off"
            show_temperature_control: true
            layout: horizontal

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:valve
                icon_color: >-
                  {% if is_state('binary_sensor.heating_kids_actuator_valve', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                content: >-
                  Valvă: {% if is_state('binary_sensor.heating_kids_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
              - type: template
                icon: mdi:timer-sand
                icon_color: amber
                content: "{{ states('sensor.heating_kids_heating_runtime_today') }} min azi"
              - type: template
                icon: mdi:water-percent
                icon_color: blue
                content: "{{ states('sensor.heating_kids_humidity') }}%"
              - type: template
                icon: mdi:battery
                icon_color: green
                content: "{{ states('sensor.heating_kids_sensor_battery') }}%"
              - type: template
                icon: mdi:bluetooth
                icon_color: grey
                content: "{{ states('sensor.heating_kids_sensor_ble_signal') }} dBm"

          # ZONA 3: DORMITOR MARE
          - type: custom:mushroom-climate-card
            entity: climate.heating_adults_adults
            name: "Dormitor Mare (2 Circuite)"
            icon: mdi:bed-double-outline
            hvac_modes:
              - heat
              - "off"
            show_temperature_control: true
            layout: horizontal

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:valve
                icon_color: >-
                  {% if is_state('binary_sensor.heating_adults_actuator_valve', 'on') %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                content: >-
                  Valvă: {% if is_state('binary_sensor.heating_adults_actuator_valve', 'on') %}Deschis{% else %}Închis{% endif %}
              - type: template
                icon: mdi:timer-sand
                icon_color: amber
                content: "{{ states('sensor.heating_adults_heating_runtime_today') }} min azi"
              - type: template
                icon: mdi:water-percent
                icon_color: blue
                content: "{{ states('sensor.heating_adults_humidity') }}%"
              - type: template
                icon: mdi:battery
                icon_color: green
                content: "{{ states('sensor.heating_adults_sensor_battery') }}%"
              - type: template
                icon: mdi:bluetooth
                icon_color: grey
                content: "{{ states('sensor.heating_adults_sensor_ble_signal') }} dBm"

      # ========================================================================
      # COLOANA 3: TELEMETRIE 24H & DIAGNOSTIC
      # ========================================================================
      - title: Telemetrie & Diagnostic
        cards:
          # GRAFIC TEMPERATURI APEXCHARTS 24H
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Evoluție Temperaturi (24h)"
              show_states: true
              colorize_states: true
            graph_span: 24h
            series:
              - entity: sensor.smart_heating_controller_outdoor_temperature
                name: "Exterior"
                color: "#94A3B8"
                stroke_width: 2
                curve: smooth
              - entity: climate.heating_living_living
                attribute: current_temperature
                name: "Living"
                color: "#F59E0B"
                stroke_width: 2
                curve: smooth
              - entity: climate.heating_kids_kids
                attribute: current_temperature
                name: "Copii"
                color: "#38BDF8"
                stroke_width: 2
                curve: smooth
              - entity: climate.heating_adults_adults
                attribute: current_temperature
                name: "Dormitor"
                color: "#10B981"
                stroke_width: 2
                curve: smooth

          # MOD SEZON ÎNCĂLZIRE (MUSHROOM SELECT FĂRĂ TEXTBOX ALB)
          - type: custom:mushroom-select-card
            entity: select.smart_heating_controller_heating_season_mode
            name: "Mod Sezon Încălzire"
            icon: mdi:calendar-sync
            icon_color: amber
            layout: horizontal

          # STARE TEHNICĂ & DIAGNOSTICARE DTC
          - type: custom:mushroom-template-card
            primary: "Diagnosticare Controller ESP32"
            secondary: >-
              Heap: {{ states('sensor.smart_heating_controller_controller_free_heap') }} KB • 
              Wi-Fi: {{ states('sensor.smart_heating_controller_controller_wi_fi_signal') }} dBm • 
              DTC: {{ states('sensor.smart_heating_controller_active_dtc_fault_count') }} defecte
            icon: >-
              {% if states('sensor.smart_heating_controller_active_dtc_fault_count') | int == 0 %}
                mdi:check-circle-outline
              {% else %}
                mdi:alert-circle-outline
              {% endif %}
            icon_color: >-
              {% if states('sensor.smart_heating_controller_active_dtc_fault_count') | int == 0 %}
                green
              {% else %}
                red
              {% endif %}
            layout: horizontal

          # BUTOANE RAPIDE DE ACȚIUNE TACTILE
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "Curăță Erori"
                secondary: "Golește jurnal DTC"
                icon: mdi:broom
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.smart_heating_controller_clear_inactive_dtc_faults
              - type: custom:mushroom-template-card
                primary: "Reia Încălzirea"
                secondary: "Anulează pauze geam"
                icon: mdi:play-circle-outline
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.smart_heating_controller_resume_heating_clear_all_window_pauses
