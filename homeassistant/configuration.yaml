homeassistant:
  name: 'Smart Heating Lab'
  unit_system: metric
  time_zone: Europe/Bucharest
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.16.0.0/12
    - 192.168.1.0/24


frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: storage
  dashboards:
    smart-heating:
      mode: yaml
      title: "Smart Heating"
      icon: mdi:radiator
      show_in_sidebar: true
      filename: dashboards/smart_heating.yaml

panel_iframe:
  odaia_clasic:
    title: "Odaia Clasic"
    icon: mdi:floor-plan
    url: "/classic/"


history:
recorder:
energy:
system_health:
sun:
mobile_app:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
logger:
  default: info
  logs:
    homeassistant.core: info
