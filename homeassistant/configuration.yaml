homeassistant:
  name: 'Smart Heating Lab'
  unit_system: metric
  time_zone: Europe/Bucharest
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: storage
  dashboards:
    smart-heating:
      mode: yaml
      title: "Smart Heating"
      icon: mdi:radiator
      show_in_sidebar: true
      filename: dashboards/smart_heating.yaml

history:
recorder:
energy:
system_health:
sun:
mobile_app:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
logger:
  default: info
  logs:
    homeassistant.core: info
