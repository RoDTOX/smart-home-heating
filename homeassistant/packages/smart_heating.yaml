# ==============================================================================
# Smart Heating - Complete Home Assistant Integration Package
# ==============================================================================
# Target Hardware: ESP32-WROOM-32E (192.168.1.20)
# All systems ported:
#   1. Energy Dashboard Gas Meter (m³ & RON) + Boile Runtime Tracking
#   2. Bi-directional Climate Thermostats with 0-delay auto sync
#   3. Boiler Plant & Pump Controls (Flame status, Auto/Manual Switch, Force ON/OFF, Cooldown)
#   4. Smart Bio-Schedule (Preset Selector, Enable/Disable Switch, Active/Next Anchor)
#   5. Xiaomi BLE Room Sensors (Temperature, Humidity, Battery %, Signal RSSI)
#   6. Diagnostic Engine (Health Score, Free Heap, Uptime, Wi-Fi RSSI, Self-Test)
# ==============================================================================

# ------------------------------------------------------------------------------
# REST PLATFORM: DUAL RESOURCE POLLING (Zones & Plant Status)
# ------------------------------------------------------------------------------
rest:
  # Resource 1: Thermal Zones, Actuators & Hysteresis
  - resource: http://192.168.1.20/api/zones
    scan_interval: 10
    headers:
      User-Agent: HomeAssistant-SmartHeating
      Accept: application/json
    sensor:
      - name: "Smart Heating - Index Contor Gaz"
        unique_id: smart_heating_gas_meter_index
        value_template: >-
          {% if value_json is defined and value_json.boilerRuntime is defined %}
            {{ (2228.0 + (value_json.boilerRuntime.thisMonthSec / 3600.0) * 0.60 + 0.40 * now().day) | round(2) }}
          {% else %}
            {{ states('sensor.smart_heating_gas_meter') }}
          {% endif %}
        unit_of_measurement: "m³"
        device_class: gas
        state_class: total_increasing
        icon: mdi:counter

      - name: "Smart Heating - Consum Gaz Astăzi"
        unique_id: smart_heating_gas_today
        value_template: >-
          {% if value_json is defined and value_json.boilerRuntime is defined %}
            {{ ((value_json.boilerRuntime.todaySec / 3600.0) * 0.60 + 0.40) | round(2) }}
          {% else %}
            0.0
          {% endif %}
        unit_of_measurement: "m³"
        device_class: gas
        state_class: total
        icon: mdi:gas-burner

      - name: "Smart Heating - Cost Gaz Astăzi"
        unique_id: smart_heating_cost_today
        value_template: >-
          {% if value_json is defined and value_json.boilerRuntime is defined %}
            {{ (((value_json.boilerRuntime.todaySec / 3600.0) * 0.60 + 0.40) * 3.30) | round(2) }}
          {% else %}
            0.0
          {% endif %}
        unit_of_measurement: "RON"
        icon: mdi:currency-eur

      - name: "Smart Heating - Timp Flacără Astăzi"
        unique_id: smart_heating_flame_today_min
        value_template: >-
          {% if value_json is defined and value_json.boilerRuntime is defined %}
            {{ (value_json.boilerRuntime.todaySec / 60) | round(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "min"
        icon: mdi:timer-outline

      - name: "Smart Heating - Ancoră Circadiană Activă"
        unique_id: smart_heating_active_anchor
        value_template: "{{ value_json.activeAnchor | default('UNKNOWN') }}"
        icon: mdi:clock-time-four-outline

      - name: "Smart Heating - Preset Circadian Activ"
        unique_id: smart_heating_active_preset
        value_template: "{{ value_json.activePreset | default('default') }}"
        icon: mdi:tune-vertical

      - name: "Smart Heating - Următoarea Ancoră"
        unique_id: smart_heating_next_anchor
        value_template: "{{ value_json.nextAnchor | default('UNKNOWN') }}"
        icon: mdi:skip-next-circle-outline

      - name: "Smart Heating - Minute Până la Următoarea Ancoră"
        unique_id: smart_heating_mins_to_next
        value_template: "{{ value_json.minsToNextAnchor | default(0) }}"
        unit_of_measurement: "min"
        icon: mdi:timer-sand

      # Zone 1 (Living)
      - name: "Smart Heating - Temp Living"
        unique_id: smart_heating_temp_living
        value_template: "{{ value_json.zones[0].currentTemp | default(21.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      - name: "Smart Heating - Tinta Living"
        unique_id: smart_heating_target_living
        value_template: "{{ value_json.zones[0].targetTemp | default(21.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature

      - name: "Smart Heating - Deschidere Vană Living"
        unique_id: smart_heating_open_sec_living
        value_template: "{{ value_json.zones[0].openSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:valve

      # Zone 2 (Copil)
      - name: "Smart Heating - Temp Copil"
        unique_id: smart_heating_temp_copil
        value_template: "{{ value_json.zones[1].currentTemp | default(22.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      - name: "Smart Heating - Tinta Copil"
        unique_id: smart_heating_target_copil
        value_template: "{{ value_json.zones[1].targetTemp | default(22.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature

      - name: "Smart Heating - Deschidere Vană Copil"
        unique_id: smart_heating_open_sec_copil
        value_template: "{{ value_json.zones[1].openSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:valve

      # Zone 3 (Matrimonial)
      - name: "Smart Heating - Temp Matrimonial"
        unique_id: smart_heating_temp_matrimonial
        value_template: "{{ value_json.zones[2].currentTemp | default(22.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      - name: "Smart Heating - Tinta Matrimonial"
        unique_id: smart_heating_target_matrimonial
        value_template: "{{ value_json.zones[2].targetTemp | default(22.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature

      - name: "Smart Heating - Deschidere Vană Matrimonial"
        unique_id: smart_heating_open_sec_matrimonial
        value_template: "{{ value_json.zones[2].openSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:valve

      # Open Window Detection Sensors (Remaining Pause & Sensitivity Threshold)
      - name: "Smart Heating - Timp Rămas Pauză Geam Living"
        unique_id: smart_heating_window_pause_sec_living
        value_template: "{{ value_json.zones[0].windowPauseRemainingSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:timer-outline

      - name: "Smart Heating - Timp Rămas Pauză Geam Copil"
        unique_id: smart_heating_window_pause_sec_copil
        value_template: "{{ value_json.zones[1].windowPauseRemainingSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:timer-outline

      - name: "Smart Heating - Timp Rămas Pauză Geam Matrimonial"
        unique_id: smart_heating_window_pause_sec_matrimonial
        value_template: "{{ value_json.zones[2].windowPauseRemainingSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:timer-outline

      - name: "Smart Heating - Prag Geam Living"
        unique_id: smart_heating_window_thresh_living
        value_template: "{{ value_json.zones[0].windowDropThreshold | default(1.2) }}"
        unit_of_measurement: "°C"
        icon: mdi:tune

      - name: "Smart Heating - Prag Geam Copil"
        unique_id: smart_heating_window_thresh_copil
        value_template: "{{ value_json.zones[1].windowDropThreshold | default(1.2) }}"
        unit_of_measurement: "°C"
        icon: mdi:tune

      - name: "Smart Heating - Prag Geam Matrimonial"
        unique_id: smart_heating_window_thresh_matrimonial
        value_template: "{{ value_json.zones[2].windowDropThreshold | default(1.2) }}"
        unit_of_measurement: "°C"
        icon: mdi:tune

    binary_sensor:
      - name: "Smart Heating - Încălzire Zonă Living"
        unique_id: smart_heating_state_living
        value_template: "{{ value_json.zones[0].relayEngaged == true or 'HEATING' in (value_json.zones[0].state | string | upper) }}"
        icon: mdi:heating-coil

      - name: "Smart Heating - Încălzire Zonă Copil"
        unique_id: smart_heating_state_copil
        value_template: "{{ value_json.zones[1].relayEngaged == true or 'HEATING' in (value_json.zones[1].state | string | upper) }}"
        icon: mdi:heating-coil

      - name: "Smart Heating - Încălzire Zonă Matrimonial"
        unique_id: smart_heating_state_matrimonial
        value_template: "{{ value_json.zones[2].relayEngaged == true or 'HEATING' in (value_json.zones[2].state | string | upper) }}"
        icon: mdi:heating-coil

      - name: "Smart Heating - Geam Deschis Living"
        unique_id: smart_heating_window_living
        value_template: "{{ value_json.zones[0].windowPauseActive == true }}"
        device_class: window
        icon: mdi:window-open-variant

      - name: "Smart Heating - Geam Deschis Copil"
        unique_id: smart_heating_window_copil
        value_template: "{{ value_json.zones[1].windowPauseActive == true }}"
        device_class: window
        icon: mdi:window-open-variant

      - name: "Smart Heating - Geam Deschis Matrimonial"
        unique_id: smart_heating_window_matrimonial
        value_template: "{{ value_json.zones[2].windowPauseActive == true }}"
        device_class: window
        icon: mdi:window-open-variant

  # Resource 2: Boiler Plant Status, Hardware Telemetry & BLE Sensors
  - resource: http://192.168.1.20/api/boiler/status
    scan_interval: 15
    headers:
      User-Agent: HomeAssistant-SmartHeating
      Accept: application/json
    sensor:
      # Weather & Environment
      - name: "Smart Heating - Temp Exterioară"
        unique_id: smart_heating_outdoor_temp
        value_template: "{{ value_json.outdoorTemp | default(10.0) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Boiler Cooldown & Runtimes
      - name: "Smart Heating - Cooldown Cazan"
        unique_id: smart_heating_boiler_cooldown
        value_template: "{{ value_json.boilerCooldownSec | default(0) }}"
        unit_of_measurement: "s"
        icon: mdi:timer-sand

      - name: "Smart Heating - Timp Flacără Lună Curentă"
        unique_id: smart_heating_flame_month_hours
        value_template: "{{ ((value_json.boilerRuntime.thisMonthSec | default(0)) / 3600.0) | round(1) }}"
        unit_of_measurement: "h"
        icon: mdi:calendar-month

      # Hardware Diagnostics
      - name: "Smart Heating - Scor Sănătate Sistem"
        unique_id: smart_heating_health_score
        value_template: "{{ value_json.healthScore | default(100) }}"
        unit_of_measurement: "%"
        icon: mdi:heart-pulse

      - name: "Smart Heating - Memorie RAM Liberă"
        unique_id: smart_heating_free_heap
        value_template: "{{ ((value_json.freeHeap | default(120000)) / 1024.0) | round(1) }}"
        unit_of_measurement: "KB"
        icon: mdi:memory

      - name: "Smart Heating - Semnal Wi-Fi RSSI"
        unique_id: smart_heating_wifi_rssi
        value_template: "{{ value_json.rssi | default(-60) }}"
        unit_of_measurement: "dBm"
        device_class: signal_strength
        icon: mdi:wifi

      - name: "Smart Heating - Timp Funcționare Uptime"
        unique_id: smart_heating_uptime_hours
        value_template: "{{ ((value_json.uptimeSec | default(0)) / 3600.0) | round(1) }}"
        unit_of_measurement: "h"
        icon: mdi:clock-outline

      - name: "Smart Heating - Serie Hardware"
        unique_id: smart_heating_serial
        value_template: "{{ value_json.serialNumber | default('SH-14721A0D5020') }}"
        icon: mdi:barcode

      - name: "Smart Heating - Versiune Firmware"
        unique_id: smart_heating_firmware
        value_template: "v{{ value_json.firmwareVersion | default('1.2.0') }}"
        icon: mdi:chip

      # Xiaomi BLE Room Thermometers Telemetry
      - name: "Smart Heating - Umiditate Living"
        unique_id: smart_heating_hum_living
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Living') | list %}
          {{ s[0].hum if s | length > 0 else 50.0 }}
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement

      - name: "Smart Heating - Baterie Senzor Living"
        unique_id: smart_heating_bat_living
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Living') | list %}
          {{ s[0].bat if s | length > 0 else 100 }}
        unit_of_measurement: "%"
        device_class: battery

      - name: "Smart Heating - Semnal BLE Living"
        unique_id: smart_heating_rssi_living
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Living') | list %}
          {{ s[0].rssi if s | length > 0 else -65 }}
        unit_of_measurement: "dBm"
        device_class: signal_strength

      - name: "Smart Heating - Umiditate Copil"
        unique_id: smart_heating_hum_copil
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Kids') | list %}
          {{ s[0].hum if s | length > 0 else 50.0 }}
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement

      - name: "Smart Heating - Baterie Senzor Copil"
        unique_id: smart_heating_bat_copil
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Kids') | list %}
          {{ s[0].bat if s | length > 0 else 100 }}
        unit_of_measurement: "%"
        device_class: battery

      - name: "Smart Heating - Semnal BLE Copil"
        unique_id: smart_heating_rssi_copil
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Kids') | list %}
          {{ s[0].rssi if s | length > 0 else -65 }}
        unit_of_measurement: "dBm"
        device_class: signal_strength

      - name: "Smart Heating - Umiditate Matrimonial"
        unique_id: smart_heating_hum_matrimonial
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Matrimonial') | list %}
          {{ s[0].hum if s | length > 0 else 50.0 }}
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement

      - name: "Smart Heating - Baterie Senzor Matrimonial"
        unique_id: smart_heating_bat_matrimonial
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Matrimonial') | list %}
          {{ s[0].bat if s | length > 0 else 100 }}
        unit_of_measurement: "%"
        device_class: battery

      - name: "Smart Heating - Semnal BLE Matrimonial"
        unique_id: smart_heating_rssi_matrimonial
        value_template: >-
          {% set s = value_json.sensors | selectattr('name', 'search', 'Matrimonial') | list %}
          {{ s[0].rssi if s | length > 0 else -65 }}
        unit_of_measurement: "dBm"
        device_class: signal_strength

    binary_sensor:
      - name: "Smart Heating - Flacără Cazan Gaz"
        unique_id: smart_heating_boiler_flame
        value_template: "{{ value_json.boiler == 'ON' }}"
        device_class: heat
        icon: mdi:fire

      - name: "Smart Heating - Pompă GPA Circulație"
        unique_id: smart_heating_pump_gpa
        value_template: "{{ value_json.pumpActive == true }}"
        device_class: running
        icon: mdi:pump

      - name: "Smart Heating - Cerere Cazan Activă"
        unique_id: smart_heating_boiler_demand
        value_template: "{{ value_json.boilerDemand == true }}"
        icon: mdi:radiator

      - name: "Smart Heating - Protecție Anti-Îngheț"
        unique_id: smart_heating_frost_guard
        value_template: "{{ value_json.frostGuardActive == true }}"
        device_class: cold
        icon: mdi:snowflake-alert

      - name: "Smart Heating - Mod Automat Activ"
        unique_id: smart_heating_auto_mode
        value_template: "{{ value_json.autoMode == true }}"
        icon: mdi:robot

      - name: "Smart Heating - Bio-Schedule Activ"
        unique_id: smart_heating_schedule_enabled
        value_template: "{{ value_json.scheduleEnabled == true }}"
        icon: mdi:calendar-clock

      - name: "Smart Heating - Pre-Heat Anticipativ"
        unique_id: smart_heating_preheat_active
        value_template: "{{ value_json.preHeatActive == true }}"
        icon: mdi:weather-dust

      - name: "Smart Heating - Comandă Amânată în Așteptare"
        unique_id: smart_heating_pending_action
        value_template: "{{ value_json.pendingAction != 'NONE' }}"
        icon: mdi:clock-alert-outline

# ------------------------------------------------------------------------------
# REST COMMANDS (Direct Remote Controls)
# ------------------------------------------------------------------------------
rest_command:
  smart_heating_set_setpoint:
    url: "http://192.168.1.20/api/zones/setpoint?id={{ zone_id }}&target={{ target_temp }}"
    method: POST

  smart_heating_set_mode:
    url: "http://192.168.1.20/api/mode?mode={{ mode }}"
    method: POST

  smart_heating_set_schedule:
    url: "http://192.168.1.20/api/schedule/enable?enabled={{ enabled }}"
    method: POST

  smart_heating_apply_preset:
    url: "http://192.168.1.20/api/schedule/preset/apply?id={{ preset_id }}"
    method: POST

  smart_heating_boiler_force_on:
    url: "http://192.168.1.20/api/boiler/on?force=true"
    method: POST

  smart_heating_boiler_force_off:
    url: "http://192.168.1.20/api/boiler/off?force=true"
    method: POST

  smart_heating_boiler_cancel:
    url: "http://192.168.1.20/api/boiler/cancel"
    method: POST

  smart_heating_diag_selftest:
    url: "http://192.168.1.20/api/diag/selftest"
    method: GET

  smart_heating_diag_clear:
    url: "http://192.168.1.20/api/diag/clear"
    method: POST

  smart_heating_window_clear:
    url: "http://192.168.1.20/api/zones/window/clear?id={{ zone_id }}"
    method: POST

  smart_heating_window_clear_all:
    url: "http://192.168.1.20/api/zones/window/clear?id=all"
    method: POST

# ------------------------------------------------------------------------------
# TEMPLATE INTEGRATION: SWITCHES & BUTTONS (Modern Syntax)
# ------------------------------------------------------------------------------
template:
  - switch:
      - name: "Smart Heating Auto Mode"
        unique_id: switch_smart_heating_auto_mode
        state: "{{ is_state('binary_sensor.smart_heating_mod_automat_activ', 'on') }}"
        turn_on:
          action: rest_command.smart_heating_set_mode
          data:
            mode: "auto"
        turn_off:
          action: rest_command.smart_heating_set_mode
          data:
            mode: "manual"
        icon: >-
          {% if is_state('binary_sensor.smart_heating_mod_automat_activ', 'on') %}
            mdi:robot
          {% else %}
            mdi:hand-back-right
          {% endif %}

      - name: "Smart Heating Schedule"
        unique_id: switch_smart_heating_schedule
        state: "{{ is_state('binary_sensor.smart_heating_bio_schedule_activ', 'on') }}"
        turn_on:
          action: rest_command.smart_heating_set_schedule
          data:
            enabled: "true"
        turn_off:
          action: rest_command.smart_heating_set_schedule
          data:
            enabled: "false"
        icon: mdi:calendar-clock

  - button:
      - name: "Smart Heating Boiler Force On"
        unique_id: button_smart_heating_boiler_force_on
        icon: mdi:fire
        press:
          action: rest_command.smart_heating_boiler_force_on

      - name: "Smart Heating Boiler Force Off"
        unique_id: button_smart_heating_boiler_force_off
        icon: mdi:fire-off
        press:
          action: rest_command.smart_heating_boiler_force_off

      - name: "Smart Heating Boiler Cancel"
        unique_id: button_smart_heating_boiler_cancel
        icon: mdi:cancel
        press:
          action: rest_command.smart_heating_boiler_cancel

      - name: "Smart Heating Diag Selftest"
        unique_id: button_smart_heating_diag_selftest
        icon: mdi:stethoscope
        press:
          action: rest_command.smart_heating_diag_selftest

      - name: "Smart Heating Diag Clear"
        unique_id: button_smart_heating_diag_clear
        icon: mdi:broom
        press:
          action: rest_command.smart_heating_diag_clear

      - name: "Reia Incalzire Geam Living"
        unique_id: button_smart_heating_window_clear_living
        icon: mdi:window-closed-variant
        press:
          action: rest_command.smart_heating_window_clear
          data:
            zone_id: 1

      - name: "Reia Incalzire Geam Copil"
        unique_id: button_smart_heating_window_clear_copil
        icon: mdi:window-closed-variant
        press:
          action: rest_command.smart_heating_window_clear
          data:
            zone_id: 2

      - name: "Reia Incalzire Geam Matrimonial"
        unique_id: button_smart_heating_window_clear_matrimonial
        icon: mdi:window-closed-variant
        press:
          action: rest_command.smart_heating_window_clear
          data:
            zone_id: 3

# ------------------------------------------------------------------------------
# INPUT SELECT: BIO-SCHEDULE PRESET SELECTOR
# ------------------------------------------------------------------------------
input_select:
  smart_heating_preset:
    name: "Preset Circadian Activ"
    icon: mdi:tune-vertical
    options:
      - "Standard / Confort"
      - "Vacanță / Eco"
      - "Home Office"
      - "Personalizat (Bogdan)"

# ------------------------------------------------------------------------------
# INPUT BOOLEANS (Virtual Actuators for Generic Thermostat)
# ------------------------------------------------------------------------------
input_boolean:
  smart_heating_dummy_living:
    name: "Living Actuator Virtual"
    icon: mdi:radiator
  smart_heating_dummy_copil:
    name: "Copil Actuator Virtual"
    icon: mdi:radiator
  smart_heating_dummy_matrimonial:
    name: "Matrimonial Actuator Virtual"
    icon: mdi:radiator

# ------------------------------------------------------------------------------
# CLIMATE ENTITIES (Generic Thermostats for Home Assistant Lovelace & Mobile App)
# ------------------------------------------------------------------------------
climate:
  - platform: generic_thermostat
    name: "Living & Bucătărie"
    unique_id: climate_smart_heating_living
    heater: input_boolean.smart_heating_dummy_living
    target_sensor: sensor.smart_heating_temp_living
    min_temp: 18.0
    max_temp: 26.0
    target_temp: 21.0
    target_temp_step: 0.5
    cold_tolerance: 0.1
    hot_tolerance: 0.1
    precision: 0.1

  - platform: generic_thermostat
    name: "Camera Copilului"
    unique_id: climate_smart_heating_copil
    heater: input_boolean.smart_heating_dummy_copil
    target_sensor: sensor.smart_heating_temp_copil
    min_temp: 18.0
    max_temp: 26.0
    target_temp: 22.0
    target_temp_step: 0.5
    cold_tolerance: 0.1
    hot_tolerance: 0.1
    precision: 0.1

  - platform: generic_thermostat
    name: "Dormitor Matrimonial"
    unique_id: climate_smart_heating_matrimonial
    heater: input_boolean.smart_heating_dummy_matrimonial
    target_sensor: sensor.smart_heating_temp_matrimonial
    min_temp: 18.0
    max_temp: 26.0
    target_temp: 22.0
    target_temp_step: 0.5
    cold_tolerance: 0.1
    hot_tolerance: 0.1
    precision: 0.1

# ------------------------------------------------------------------------------
# AUTOMATIONS: BIDIRECTIONAL SYNC (HA <-> ESP32)
# ------------------------------------------------------------------------------
automation:
  # Living Setpoint Sync (HA -> ESP32)
  - id: auto_sync_ha_to_esp_living
    alias: "Smart Heating - Sync HA to ESP32 Living Setpoint"
    mode: restart
    trigger:
      - platform: state
        entity_id: climate.living_bucatarie
        attribute: temperature
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.attributes.temperature is defined and
             trigger.to_state.attributes.temperature is not none and
             trigger.from_state.attributes.temperature is not none and
             trigger.to_state.attributes.temperature != trigger.from_state.attributes.temperature and
             (trigger.to_state.attributes.temperature | float) != (states('sensor.smart_heating_tinta_living') | float(-999)) }}
    action:
