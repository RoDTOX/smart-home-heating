title: "Smart Heating"
views:
  # ============================================================================
  # TAB 1: PANOU DE CONTROL (TERMOSTATE & COMANDĂ CENTRALĂ)
  # ============================================================================
  - title: "Panou Principal"
    path: "overview"
    icon: "mdi:home-thermometer-outline"
    badges:
      - entity: binary_sensor.smart_heating_flacara_cazan_gaz
      - entity: binary_sensor.smart_heating_pompa_gpa_circulatie
      - entity: binary_sensor.smart_heating_cerere_cazan_activa
      - entity: sensor.smart_heating_temp_exterioara
      - entity: sensor.smart_heating_cost_gaz_astazi
      - entity: binary_sensor.smart_heating_geam_deschis_living
      - entity: binary_sensor.smart_heating_geam_deschis_copil
      - entity: binary_sensor.smart_heating_geam_deschis_matrimonial
    cards:
      # ------------------------------------------------------------------------
      # ALERTE ACTIVE: DETECȚIE GEAM DESCHIS (AFIȘATE AUTOMAT LA AERISIRE)
      # ------------------------------------------------------------------------
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.smart_heating_geam_deschis_living
            state: "on"
        card:
          type: entities
          title: "🪟 Aerisire: Living & Bucătărie"
          show_header_toggle: false
          entities:
            - entity: binary_sensor.smart_heating_geam_deschis_living
              name: "Stare Aerisire"
            - entity: sensor.smart_heating_timp_ramas_pauza_geam_living
              name: "Pauză Rămasă"
            - entity: button.reia_incalzire_geam_living
              name: "Am Închis Geamul (Reia)"

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.smart_heating_geam_deschis_copil
            state: "on"
        card:
          type: entities
          title: "🪟 Aerisire: Camera Copilului"
          show_header_toggle: false
          entities:
            - entity: binary_sensor.smart_heating_geam_deschis_copil
              name: "Stare Aerisire"
            - entity: sensor.smart_heating_timp_ramas_pauza_geam_copil
              name: "Pauză Rămasă"
            - entity: button.reia_incalzire_geam_copil
              name: "Am Închis Geamul (Reia)"

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.smart_heating_geam_deschis_matrimonial
            state: "on"
        card:
          type: entities
          title: "🪟 Aerisire: Dormitor Matrimonial"
          show_header_toggle: false
          entities:
            - entity: binary_sensor.smart_heating_geam_deschis_matrimonial
              name: "Stare Aerisire"
            - entity: sensor.smart_heating_timp_ramas_pauza_geam_matrimonial
              name: "Pauză Rămasă"
            - entity: button.reia_incalzire_geam_matrimonial
              name: "Am Închis Geamul (Reia)"

      # ------------------------------------------------------------------------
      # Card 1: Stare Centrală & Comandă Pompă / Mod
      # ------------------------------------------------------------------------
      - type: entities
        title: "🔥 Centrală Gaz & Pompă GPA"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.smart_heating_flacara_cazan_gaz
            name: "Flacără Cazan Gaz"
          - entity: binary_sensor.smart_heating_pompa_gpa_circulatie
            name: "Pompă GPA Pardoseală"
          - entity: switch.smart_heating_auto_mode
            name: "Mod Operare Centrală"
          - entity: sensor.smart_heating_cooldown_cazan
            name: "Timp Cooldown Rămas"
          - entity: binary_sensor.smart_heating_protectie_anti_inghet
            name: "Protecție Anti-Îngheț"

      # ------------------------------------------------------------------------
      # Card 2: Termostate Zone Termice (Mobile & Desktop)
      # ------------------------------------------------------------------------
      - type: thermostat
        entity: climate.living_bucatarie
        name: "🛋️ Living & Bucătărie"

      - type: thermostat
        entity: climate.camera_copilului
        name: "🧸 Camera Copilului"

      - type: thermostat
        entity: climate.dormitor_matrimonial
        name: "🛏️ Dormitor Matrimonial"

      # ------------------------------------------------------------------------
      # Card 3: Smart Bio-Schedule & Presets
      # ------------------------------------------------------------------------
      - type: entities
        title: "🌿 Smart Bio-Schedule (Circadian)"
        show_header_toggle: false
        entities:
          - entity: input_select.smart_heating_preset
            name: "Preset Selectat"
          - entity: switch.smart_heating_schedule
            name: "Orar Inteligent Master"
          - entity: sensor.smart_heating_ancora_circadiana_activa
            name: "Ancoră Circadiană Activă"
          - entity: sensor.smart_heating_urmatoarea_ancora
            name: "Următoarea Ancoră"
          - entity: sensor.smart_heating_minute_pana_la_urmatoarea_ancora
            name: "Timp Până la Tranziție"

      # ------------------------------------------------------------------------
      # Card 4: Butoane Comenzi Rapide Manuale
      # ------------------------------------------------------------------------
      - type: grid
        title: "⚡ Comenzi Rapide Centrală"
        columns: 3
        square: false
        cards:
          - type: button
            entity: button.smart_heating_boiler_force_on
            name: "Pornește"
            icon: mdi:fire
            tap_action:
              action: toggle
          - type: button
            entity: button.smart_heating_boiler_force_off
            name: "Oprește"
            icon: mdi:fire-off
            tap_action:
              action: toggle
          - type: button
            entity: button.smart_heating_boiler_cancel
            name: "Anulează"
            icon: mdi:cancel
            tap_action:
              action: toggle

  # ============================================================================
  # TAB 2: CONTOR GAZ & ENERGIE
  # ============================================================================
  - title: "Gaz & Energie"
    path: "energy"
    icon: "mdi:meter-gas"
    cards:
      - type: entities
        title: "📊 Consum & Factură Gaz"
        show_header_toggle: false
        entities:
          - entity: sensor.smart_heating_index_contor_gaz
            name: "Index Contor Fizic"
          - entity: sensor.smart_heating_consum_gaz_astazi
            name: "Consum Gaz Astăzi"
          - entity: sensor.smart_heating_cost_gaz_astazi
            name: "Cost Gaz Astăzi (3.30 Lei/m³)"
          - entity: sensor.smart_heating_timp_flacara_astazi
            name: "Timp Flacără Astăzi"
          - entity: sensor.smart_heating_timp_flacara_luna_curenta
            name: "Timp Flacără Lună Curentă"

      - type: history-graph
        title: "📈 Istoric Temperaturi Camere (24 Ore)"
        hours_to_show: 24
        entities:
          - entity: sensor.smart_heating_temp_living
            name: "Living"
          - entity: sensor.smart_heating_temp_copil
            name: "Copil"
          - entity: sensor.smart_heating_temp_matrimonial
            name: "Matrimonial"
          - entity: sensor.smart_heating_temp_exterioara
            name: "Exterior"

      - type: history-graph
        title: "🔥 Cicluri Funcționare Cazan & Pompă"
        hours_to_show: 24
        entities:
          - entity: binary_sensor.smart_heating_flacara_cazan_gaz
            name: "Flacără Cazan"
          - entity: binary_sensor.smart_heating_pompa_gpa_circulatie
            name: "Pompă GPA"
          - entity: binary_sensor.smart_heating_incalzire_zona_living
            name: "Vană Living"
          - entity: binary_sensor.smart_heating_incalzire_zona_copil
            name: "Vană Copil"
          - entity: binary_sensor.smart_heating_incalzire_zona_matrimonial
            name: "Vană Matrimonial"

  # ============================================================================
  # TAB 3: SENZORI XIAOMI BLE & DIAGNOSTIC HARDWARE
  # ============================================================================
  - title: "Senzori & Diagnostic"
    path: "diagnostics"
    icon: "mdi:chip"
    cards:
      - type: entities
        title: "📡 Termometre Xiaomi BLE (Baterii & Semnal)"
        show_header_toggle: false
        entities:
          - entity: sensor.smart_heating_temp_living
            name: "Living - Temp"
          - entity: sensor.smart_heating_umiditate_living
            name: "Living - Umiditate"
          - entity: sensor.smart_heating_baterie_senzor_living
            name: "Living - Baterie"
          - entity: sensor.smart_heating_semnal_ble_living
            name: "Living - Semnal BLE"
          - entity: sensor.smart_heating_temp_copil
            name: "Copil - Temp"
          - entity: sensor.smart_heating_umiditate_copil
            name: "Copil - Umiditate"
          - entity: sensor.smart_heating_baterie_senzor_copil
            name: "Copil - Baterie"
          - entity: sensor.smart_heating_semnal_ble_copil
            name: "Copil - Semnal BLE"
          - entity: sensor.smart_heating_temp_matrimonial
            name: "Matrimonial - Temp"
          - entity: sensor.smart_heating_umiditate_matrimonial
            name: "Matrimonial - Umiditate"
          - entity: sensor.smart_heating_baterie_senzor_matrimonial
            name: "Matrimonial - Baterie"
          - entity: sensor.smart_heating_semnal_ble_matrimonial
            name: "Matrimonial - Semnal BLE"

      - type: entities
        title: "⚙️ Diagnostic Hardware ESP32"
        show_header_toggle: false
        entities:
          - entity: sensor.smart_heating_scor_sanatate_sistem
            name: "Scor Sănătate Sistem"
          - entity: sensor.smart_heating_memorie_ram_libera
            name: "Memorie RAM Liberă (Heap)"
          - entity: sensor.smart_heating_semnal_wi_fi_rssi
            name: "Semnal Wi-Fi RSSI"
          - entity: sensor.smart_heating_timp_functionare_uptime
            name: "Timp Funcționare (Uptime)"
          - entity: sensor.smart_heating_versiune_firmware
            name: "Versiune Firmware"
          - entity: sensor.smart_heating_serie_hardware
            name: "Serie Hardware Dispozitiv"

      - type: grid
        title: "🛠️ Acțiuni Diagnoză"
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.smart_heating_diag_selftest
            name: "Rulează Self-Test"
            icon: mdi:stethoscope
            tap_action:
              action: toggle
          - type: button
            entity: button.smart_heating_diag_clear
            name: "Șterge Erori DTC"
            icon: mdi:broom
            tap_action:
              action: toggle
