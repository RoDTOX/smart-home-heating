[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = tcp://192.168.1.20:23
upload_speed = 460800
board_build.partitions = min_spiffs.csv
extra_scripts =
	pre:tools/build_web.py
	pre:tools/git_version.py
build_flags =
	-Os
	-D MYNEWT_VAL_BLE_ROLE_BROADCASTER=0
	-D MYNEWT_VAL_BLE_ROLE_CENTRAL=0
	-D MYNEWT_VAL_BLE_ROLE_PERIPHERAL=0
	-D MYNEWT_VAL_BLE_ROLE_OBSERVER=1
	-D MYNEWT_VAL_BLE_SM=0
	-D MYNEWT_VAL_BLE_HS_LOG_LVL=0
	-D MYNEWT_VAL_NIMBLE_CPP_LOG_LEVEL=0
	-D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=0
	-D CONFIG_NIMBLE_CPP_ENABLE_WARNINGS=0



