[platformio]
default_envs = esp32dev

[esp32_base]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = tcp://192.168.1.20:23
upload_speed = 460800
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/sh_git_version.py, pre:tools/sh_build_web.py
build_flags = 
	-Os
	-D MYNEWT_VAL_BLE_ROLE_BROADCASTER=0
	-D MYNEWT_VAL_BLE_ROLE_CENTRAL=0
	-D MYNEWT_VAL_BLE_ROLE_PERIPHERAL=0
	-D MYNEWT_VAL_BLE_ROLE_OBSERVER=1
	-D MYNEWT_VAL_BLE_SM=0
	-D MYNEWT_VAL_BLE_MAX_CONNECTIONS=1
	-D MYNEWT_VAL_MSYS_1_BLOCK_COUNT=8
	-D MYNEWT_VAL_BLE_HS_LOG_LVL=0
	-D MYNEWT_VAL_NIMBLE_CPP_LOG_LEVEL=0
	-D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=0
	-D CONFIG_NIMBLE_CPP_ENABLE_WARNINGS=0

; Development profile (FR-75.6): console, Telnet and /update open. NEVER for a release (PB-104).
[env:esp32dev]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	-D SH_DEV_OPEN

; Release profile: the login of FR-75 is enforced.
[env:esp32release]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}

; Host test bench (docs/plan.md I-1): pure logic compiled with PC C++ compiler + Unity.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<SafetySupervisor.cpp> +<Schedule.cpp> +<ModeManager.cpp> +<ZoneController.cpp> +<HeatUpModel.cpp> +<SolarThrottle.cpp> +<HumidityComp.cpp> +<CycleAligner.cpp> +<SmartWindow.cpp> +<PlantMonitor.cpp>
build_flags =
	-std=c++17
	-Iinclude
