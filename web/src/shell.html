<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Încălzire</title>
<style>
{{STYLES}}
</style>
</head>
<body>
<header class="hbar">
  <div class="hin">
    <div class="brand"><div class="logo" id="logo"></div><h1>Încălzire</h1></div>
    <div class="meta"><span id="clock">--:--</span><span id="outdoor">afară --</span><span id="boiler">centrala --</span><span id="level"></span></div>
    <div class="ctrls">
      <div class="seg themes" id="themeBtns" role="group" aria-label="Temă"></div>
      <select id="themeSel" aria-label="Temă"></select>
      <button id="away">Plecat</button>
      <button type="button" id="toggleAdmin" class="btn-top-admin">Admin</button>
    </div>
  </div>
</header>
<main>

<div id="adminAuthModal" class="modal">
  <div class="card">
    <h3 class="ttl"><span id="icLock"></span>Autentificare administrator</h3>
    <div class="tiny" style="margin-top:6px">Introduceți parola pentru a accesa setările și diagnoza instalației.</div>
    <form id="adminAuthForm" onsubmit="event.preventDefault();submitAdminAuth();">
      <input id="adminAuthPass" type="password" placeholder="Parolă administrator" autocomplete="current-password">
      <div id="adminAuthErr" class="tiny" style="color:var(--bad);margin-bottom:10px;min-height:16px"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button type="button" onclick="closeAdminAuthModal()">Anulează</button>
        <button type="submit" id="adminAuthSubmit" class="on">Deblochează</button>
      </div>
    </form>
  </div>
</div>
{{CARD_ROOMS}}
<div id="admin">
<div class="admbar">
  <h2 class="ttl"><span id="icAdm"></span>Administrare</h2>
  <div class="seg admnav" id="admNav" role="group" aria-label="Secțiune"></div>
</div>
{{CARD_SCHEDULE}}
{{CARD_DIAGNOSTICS}}
{{CARD_HISTORY}}
{{CARD_SETUP}}
{{CARD_CONSOLE}}
</div>

<footer>
  <span style="opacity:0.8">Smart Heating</span>
  <span id="fwInfo" class="s" style="opacity:0.75;margin-left:8px"></span>
  <span id="devBanner" class="s" style="display:none;opacity:0.5;margin-left:12px;color:var(--warn)">🛠️ DEV - consola deschisă</span>
</footer>
<div id="toast" role="alert"></div>
</main>
<!-- FR-8.1: API names watched by the engineering view and their explanation [text, requirement, "v" = changes continuously] -->
<script type="application/json" id="doc">
{{DOC_JSON}}
</script>
<script>
{{SCRIPTS}}
</script>
</body>
</html>
