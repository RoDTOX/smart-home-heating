<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Încălzire</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1f24;--mut:#6b7280;--line:#e5e7eb;--heat:#ea580c;--idle:#2563eb;--away:#9ca3af;--bad:#dc2626;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#e8eaed;--mut:#9aa0a6;--line:#2a2e36;--heat:#fb923c;--idle:#60a5fa;--away:#6b7280;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
header h1{font-size:20px;margin:0}
.meta{color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.room{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--idle);border-radius:14px;padding:14px;cursor:pointer}
.room.heat{border-left-color:var(--heat)}.room.away{border-left-color:var(--away)}.room.bad{border-left-color:var(--bad)}
.room .t{font-size:40px;font-weight:600;line-height:1.1}
.room .s{color:var(--mut)}
.ctl{display:none;margin-top:12px;gap:8px;align-items:center;flex-wrap:wrap}
.room.open .ctl{display:flex}
.alerts{margin:0 0 12px;padding:0;list-style:none}
.alerts li{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:6px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
section h2{font-size:16px;margin:0 0 10px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
input,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}
input.n{width:64px}input.w{width:100%;max-width:420px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.scroll{overflow-x:auto}
footer{margin-top:20px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}
a{color:var(--idle)}
#admin{display:none}body.admin #admin{display:block}
</style>
</head>
<body>
<main>
<header>
  <h1>Încălzire</h1>
  <div class="meta"><span id="clock">--:--</span><span id="outdoor">afară --</span><span id="boiler">centrala --</span><span id="level"></span></div>
  <button id="away">Plecat</button>
</header>
<ul class="alerts" id="alerts"></ul>
<div class="grid" id="rooms"></div>

<div id="admin">
  <section>
    <h2>Program (același pentru toate zonele)</h2>
    <div class="row"><label><input type="checkbox" id="schedOn"> Program activ</label></div>
    <div class="scroll"><table id="levels"></table></div>
    <div class="row"><span style="width:90px">Luni–Vineri</span><input class="w" id="wd"></div>
    <div class="row"><span style="width:90px">Weekend</span><input class="w" id="we"></div>
    <div class="row s">Format: 06:30=day,08:30=away,17:00=day,22:30=night</div>
    <div class="row"><button id="saveSched">Salvează programul</button><span id="schedMsg" class="s"></span></div>
  </section>
  <section>
    <h2>Senzori BLE</h2>
    <div class="scroll"><table id="sensors"></table></div>
  </section>
  <section>
    <h2>Zone</h2>
    <div class="scroll"><table id="zones"></table></div>
  </section>
  <section>
    <h2>Sistem</h2>
    <div class="row">Locație (lat,lon) <input id="loc" placeholder="45.65,25.60"><button id="saveLoc">Salvează</button></div>
    <div class="scroll"><table id="sys"></table></div>
    <div class="row"><a href="/update">Actualizare firmware (OTA)</a></div>
  </section>
</div>

<footer><a href="#" id="toggleAdmin">Admin</a><span id="err"></span></footer>
</main>
<script>
const MIN_T = 16, MAX_T = 22.5, STEP = 0.5;
const LEVELS = ["day", "night", "away"], LEVEL_RO = {day: "zi", night: "noapte", away: "plecat"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let Z = null, S = null, B = [], ST = null, D = null, openRoom = -1, editing = false;

async function api(path, params) {
  const opt = params ? {method: "POST", body: new URLSearchParams(params)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(path + " HTTP " + r.status);
  return r.json();
}

function roomClass(z) {
  if (z.sensorFault || !z.enabled) return "bad";
  if (Z.away) return "away";
  return z.relayEngaged ? "heat" : "";
}

function renderRooms() {
  const hum = {};
  B.forEach(s => hum[s.mac.toUpperCase()] = s);
  $("rooms").innerHTML = Z.zones.map((z, i) => {
    const s = hum[(z.sensorMac || "").toUpperCase()];
    const t = z.sensorValid ? z.currentTemp.toFixed(1) + "°" : "--";
    const h = s ? " · " + Math.round(s.hum) + "%" : "";
    const hold = z.isManualHold ? " · boost" : "";
    return `<div class="room ${roomClass(z)} ${openRoom === i ? "open" : ""}" data-i="${i}">
      <div>${esc(z.name)}</div><div class="t">${t}</div>
      <div class="s">țintă ${z.effectiveTarget.toFixed(1)}°${h}${hold}</div>
      <div class="ctl">
        <button data-a="dn" data-i="${i}">−</button><b>${z.effectiveTarget.toFixed(1)}°</b><button data-a="up" data-i="${i}">+</button>
        ${z.isManualHold ? `<button data-a="clr" data-i="${i}">Înapoi la program</button>` : ""}
      </div></div>`;
  }).join("");
}

function renderHeader() {
  $("clock").textContent = ST ? ST.time.slice(0, 5) : "--:--";
  $("outdoor").textContent = ST && ST.outdoorTemp > -100 ? "afară " + ST.outdoorTemp.toFixed(1) + "°" : "afară --";
  $("boiler").textContent = "centrala " + (Z.boiler === "ON" ? "pornită 🔥" : "oprită");
  $("level").textContent = Z.away ? "mod plecat" : Z.scheduleEnabled ? "acum " + LEVEL_RO[Z.activeLevel] + (Z.preHeatActive ? " (preîncălzire)" : "") : "program oprit";
  $("away").classList.toggle("on", Z.away);
}

function renderAlerts() {
  const a = [];
  Z.zones.forEach(z => {
    if (z.sensorFault) a.push(`${z.name}: senzor offline – zonă oprită`);
    if (z.frostActive) a.push(`${z.name}: protecție la îngheț activă`);
    if (z.windowPauseActive) a.push(`${z.name}: fereastră deschisă – pauză ${Math.ceil(z.windowPauseRemainingSec / 60)} min`);
  });
  B.forEach(s => { if (s.bat > 0 && s.bat < 15) a.push(`Baterie slabă: ${s.name || s.mac} (${s.bat}%)`); });
  (D && D.dtcs || []).forEach(d => a.push(`${d.code}: ${d.message}`));
  $("alerts").innerHTML = a.map(x => `<li>${esc(x)}</li>`).join("");
}

function renderAdmin() {
  if (!document.body.classList.contains("admin") || !S) return;
  if (!editing) {
    $("schedOn").checked = S.enabled;
    $("wd").value = S.weekday;
    $("we").value = S.weekend;
    $("levels").innerHTML = "<tr><th>Zonă</th><th>Zi</th><th>Noapte</th><th>Plecat</th></tr>" + S.zones.map((z, i) =>
      `<tr><td>${esc(z.name)}</td>${LEVELS.map(l => `<td><input class="n" type="number" step="0.5" min="5" max="30" data-z="${i + 1}" data-l="${l}" value="${z[l].toFixed(1)}"></td>`).join("")}</tr>`).join("");
  }
  const opts = Z.zones.map((z, i) => `<option value="${i}">${esc(z.name)}</option>`).join("");
  $("sensors").innerHTML = "<tr><th>Nume</th><th>MAC</th><th>°C</th><th>%</th><th>Bat</th><th>RSSI</th><th>Văzut</th><th>Zonă</th></tr>" + B.map(s => {
    const zi = Z.zones.findIndex(z => (z.sensorMac || "").toUpperCase() === s.mac.toUpperCase());
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.mac)}</td><td>${s.temp.toFixed(1)}</td><td>${Math.round(s.hum)}</td><td>${s.bat}%</td><td>${s.rssi}</td><td>${s.ageSec}s</td>
      <td><select data-mac="${esc(s.mac)}"><option value="">–</option>${opts}</select></td></tr>`.replace(`value="${zi}"`, `value="${zi}" selected`);
  }).join("");
  $("zones").innerHTML = "<tr><th>Zonă</th><th>Stare</th><th>Robinet</th><th>Cerere</th><th>Țintă</th></tr>" + Z.zones.map(z =>
    `<tr><td>${esc(z.name)}</td><td>${esc(z.state)}</td><td>${z.relayEngaged ? "deschis " + Math.round(z.openSec / 60) + " min" : "închis"}</td><td>${z.demand ? "da" : "nu"}</td><td>${z.effectiveTarget.toFixed(1)}°</td></tr>`).join("");
  const rt = Z.boilerRuntime || {};
  const rows = ST ? [["Firmware", `${ST.firmwareVersion} (${ST.gitCommit})`], ["Uptime", Math.round(ST.uptimeSec / 3600) + " h"], ["Heap liber", Math.round(ST.freeHeap / 1024) + " KB"],
    ["Wi-Fi", ST.rssi + " dBm"], ["Sănătate", (D ? D.healthScore : "--") + "%"], ["Ardere azi", Math.round((rt.todaySec || 0) / 60) + " min"], ["Ardere luna aceasta", Math.round((rt.thisMonthSec || 0) / 3600) + " h"]] : [];
  $("sys").innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("");
}

async function refresh() {
  try {
    [Z, B, ST, D] = await Promise.all([api("/api/zones"), api("/api/ble/sensors").then(r => r.sensors), api("/api/boiler/status"), api("/api/diag/status")]);
    if (document.body.classList.contains("admin")) S = await api("/api/schedule");
    renderHeader(); renderRooms(); renderAlerts(); renderAdmin();
    $("err").textContent = "";
  } catch (e) { $("err").textContent = "Conexiune pierdută (" + e.message + ")"; }
}

$("rooms").addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (b) {
    const i = +b.dataset.i, z = Z.zones[i];
    if (b.dataset.a === "clr") await api("/api/zones/hold/clear", {id: i + 1});
    else {
      const t = Math.min(MAX_T, Math.max(MIN_T, z.effectiveTarget + (b.dataset.a === "up" ? STEP : -STEP)));
      await api("/api/zones/setpoint", {id: i + 1, target: t.toFixed(1)});
    }
    return refresh();
  }
  if (e.target.closest(".ctl")) return;
  const card = e.target.closest(".room");
  if (card) { openRoom = openRoom === +card.dataset.i ? -1 : +card.dataset.i; renderRooms(); }
});

$("away").onclick = async () => { await api("/api/schedule/enable", {away: Z.away ? 0 : 1}); refresh(); };

$("toggleAdmin").onclick = e => { e.preventDefault(); document.body.classList.toggle("admin"); location.hash = document.body.classList.contains("admin") ? "admin" : ""; refresh(); };
if (location.hash === "#admin") document.body.classList.add("admin");

// While the schedule form is being edited, refreshes must not overwrite the inputs
const schedForm = $("saveSched").closest("section");
schedForm.addEventListener("focusin", () => editing = true);
schedForm.addEventListener("focusout", e => { if (!schedForm.contains(e.relatedTarget)) editing = false; });
$("admin").addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.mac !== undefined && el.value !== "") {
    await api("/api/setup/map-zone", {zone: el.value, mac: el.dataset.mac});
    refresh();
  }
});

$("saveSched").onclick = async () => {
  try {
    await api("/api/schedule/enable", {enabled: $("schedOn").checked ? 1 : 0});
    for (const el of document.querySelectorAll("#levels input")) {
      const z = S.zones[el.dataset.z - 1];
      if (Math.abs(z[el.dataset.l] - parseFloat(el.value)) > 0.04) await api("/api/schedule/level", {zone: el.dataset.z, level: el.dataset.l, temp: el.value});
    }
    if ($("wd").value !== S.weekday) await api("/api/schedule/slots", {weekend: 0, slots: $("wd").value});
    if ($("we").value !== S.weekend) await api("/api/schedule/slots", {weekend: 1, slots: $("we").value});
    $("schedMsg").textContent = "Salvat.";
  } catch (e) { $("schedMsg").textContent = "Eroare: " + e.message; }
  editing = false; refresh();
};

$("saveLoc").onclick = async () => { await api("/api/setup/location", {coords: $("loc").value}); refresh(); };
api("/api/setup/location").then(r => $("loc").value = r.coords).catch(() => {});

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
</script>
</body>
</html>
