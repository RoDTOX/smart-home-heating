<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Smart Heating - Live Wi-Fi Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#090d16;color:#f1f5f9;display:flex;flex-direction:column;height:100vh;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#111827;border-radius:10px;border:1px solid #1f2937;margin-bottom:10px}
.title{font-size:1.1rem;font-weight:700;color:#38bdf8;display:flex;align-items:center;gap:8px}
.badge{background:#065f46;color:#34d399;font-size:.75rem;padding:3px 8px;border-radius:6px;font-weight:600}
.nav-links{display:flex;gap:12px;font-size:.85rem}.nav-links a{color:#94a3b8;text-decoration:none}.nav-links a:hover{color:#38bdf8}
.quick-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.qbtn{background:#1f2937;color:#e2e8f0;border:1px solid #374151;border-radius:6px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.qbtn:hover{background:#374151;color:#fff;border-color:#60a5fa}.qbtn.on{background:#065f46;border-color:#059669;color:#a7f3d0}.qbtn.off{background:#7f1d1d;border-color:#dc2626;color:#fecaca}
.term-container{flex:1;background:#030712;border:1px solid #1f2937;border-radius:10px;padding:10px 12px;overflow:auto;font-family:monospace;font-size:.82rem;line-height:1.42;color:#e2e8f0;white-space:pre}
.term-container.wrap-enabled{white-space:pre-wrap;word-break:break-word}.log-line{padding:1px 0;white-space:inherit}
.fbtn{background:#1f2937;color:#94a3b8;border:1px solid #374151;border-radius:4px;padding:2px 7px;font-size:.75rem;cursor:pointer;font-weight:700}
@media(max-width:640px){body{padding:8px}.header{padding:6px 10px;margin-bottom:6px}.title{font-size:.95rem}.nav-links{gap:8px;font-size:.75rem}.quick-bar{margin-bottom:6px;gap:4px}.qbtn{padding:5px 8px;font-size:.72rem}.term-container{font-size:.7rem;padding:8px}.cmd-input{padding:8px 10px;font-size:.85rem}.send-btn{padding:8px 14px;font-size:.85rem}.controls{font-size:.7rem;flex-wrap:wrap;gap:6px}}
.t-time{color:#64748b}.t-thm{color:#fb923c;font-weight:600}.t-wth{color:#38bdf8;font-weight:700}.t-ble{color:#c084fc;font-weight:600}.t-tim{color:#facc15;font-weight:600}.t-pas{color:#34d399;font-weight:600}.t-dia{color:#f472b6;font-weight:600}.t-cmd{color:#22d3ee;font-weight:700}.t-cpu{color:#c084fc;font-weight:700}.t-mem{color:#f472b6;font-weight:700}.t-fls{color:#fb923c;font-weight:700}.t-temp{color:#38bdf8;font-weight:700}.t-err{color:#f87171;font-weight:700}.t-wrn{color:#fbbf24;font-weight:600}.t-ok{color:#4ade80;font-weight:700}.t-off{color:#f87171;font-weight:700}.t-idle{color:#38bdf8;font-weight:700}.t-demand{color:#fb923c;font-weight:700}.t-auto{color:#22d3ee;font-weight:700}.t-man{color:#e879f9;font-weight:700}.t-warm{color:#facc15;font-weight:700}.t-tst{color:#f59e0b;font-weight:700;background:rgba(245,158,11,.15);padding:1px 6px;border-radius:4px}
.b-exc{color:#34d399;font-weight:700;background:rgba(52,211,153,.15);padding:1px 5px;border-radius:4px}.b-good{color:#60a5fa;font-weight:700;background:rgba(96,165,250,.15);padding:1px 5px;border-radius:4px}.b-marg{color:#f59e0b;font-weight:700;background:rgba(245,158,11,.15);padding:1px 5px;border-radius:4px}.b-poor{color:#ef4444;font-weight:700;background:rgba(239,68,68,.15);padding:1px 5px;border-radius:4px}
.input-bar{display:flex;gap:8px;margin-top:10px;align-items:center}.cmd-input{flex:1;background:#111827;border:1px solid #374151;color:#f9fafb;padding:10px 14px;border-radius:8px;font-family:monospace;font-size:.95rem;outline:none}.cmd-input:focus{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.2)}
.cmd-start{background:#0c2a4d;border-left:4px solid #38bdf8;border-top:1px solid #1e3a5f;border-bottom:1px solid #1e3a5f;border-radius:6px;padding:4px 8px;margin:12px 0 4px;font-weight:700;box-shadow:0 2px 8px rgba(56,189,248,.15);color:#38bdf8}
.cmd-end{background:rgba(30,41,59,.5);border-left:4px solid #64748b;border-radius:4px;padding:2px 8px;margin:4px 0 12px;color:#94a3b8;font-size:.76rem}
.t-sep{color:#334155;opacity:.8}
.send-btn{background:#0284c7;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:.9rem}.send-btn:hover{background:#0369a1}
.controls{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:#64748b;margin-top:6px;padding:0 4px}
</style></head><body>
<div class='header'>
<div class='title'><span>&gt;_</span> Smart Heating 2-Way Console <span class='badge' id='statusBadge'>LIVE</span></div>
<div class='nav-links'>
<a id='navDash' href='/'>&larr; Dashboard</a>
<a id='navOta' href='/update'>OTA Firmware</a>
<a href='https://pvvx.github.io/ATC_MiThermometer/TelinkMiFlasher.html' target='_blank' rel='noopener' title='Configure Xiaomi BLE sensor RF transmit power and settings'>BLE Sensor Config</a>
</div>
</div>
<div class='quick-bar'>
<button class='qbtn' onclick="sendCmd('STATUS')">STATUS</button>
<button class='qbtn on' onclick="sendCmd('ON')">START BOILER</button>
<button class='qbtn off' onclick="sendCmd('OFF')">STOP BOILER</button>
<button class='qbtn' onclick="sendCmd('AUTO')">AUTO MODE</button>
<button class='qbtn' onclick="sendCmd('MANUAL')">MANUAL MODE</button>
<button class='qbtn' onclick="sendCmd('HELP')">HELP (?)</button>
<button class='qbtn' onclick="clearTerm()">CLEAR</button>
</div>
<div class='term-container' id='terminal'></div>
<form class='input-bar' onsubmit="handleSubmit(event)">
<input type='text' id='cmdInput' class='cmd-input' placeholder="Enter command (e.g. STATUS, ON, OFF, SET 1 22.5, HELP)..." autocomplete='off' autofocus>
<button type='submit' class='send-btn'>Send</button>
</form>
<div class='controls'>
<div>Telnet: <b>192.168.1.20:23</b></div>
<div style='display:flex;gap:10px;align-items:center;'>
<label title='Toggle word wrap'><input type='checkbox' id='wrapToggle'> Wrap</label>
<label title='Automatically scroll to newest output'><input type='checkbox' id='autoScroll' checked> Auto-scroll</label>
<button type='button' class='fbtn' onclick='adjustFont(-1)' title='Decrease font size'>A-</button>
<button type='button' class='fbtn' onclick='adjustFont(1)' title='Increase font size'>A+</button>
</div>
</div>
<script>
const base = window.location.protocol === 'file:' ? 'http://192.168.1.20' : window.location.pathname.replace(/\/console(\.html)?\/?$/, '');
const navDash = document.getElementById('navDash');
const navOta = document.getElementById('navOta');
if (navDash) navDash.href = (base || '') + '/';
if (navOta) navOta.href = (base || '') + '/update';
let lastSeq = 0;
let isFetching = false;
let isSending = false;
let pollTimer = null;
let fetchAbortCtrl = null;
const term = document.getElementById('terminal');
const cmdInput = document.getElementById('cmdInput');
const autoScroll = document.getElementById('autoScroll');
const wrapToggle = document.getElementById('wrapToggle');
if (wrapToggle) {
  const isWrap = localStorage.getItem('termWrap') === 'true';
  wrapToggle.checked = isWrap;
  if (isWrap) term.classList.add('wrap-enabled');
  wrapToggle.addEventListener('change', () => {
    if (wrapToggle.checked) {
      term.classList.add('wrap-enabled');
      localStorage.setItem('termWrap', 'true');
    } else {
      term.classList.remove('wrap-enabled');
      localStorage.setItem('termWrap', 'false');
    }
  });
}
let termFs = parseFloat(localStorage.getItem('termFontSize') || (window.innerWidth < 640 ? '0.70' : '0.82'));
term.style.fontSize = termFs + 'rem';
function adjustFont(dir) {
  termFs = Math.max(0.52, Math.min(1.2, termFs + dir * 0.06));
  term.style.fontSize = termFs.toFixed(2) + 'rem';
  localStorage.setItem('termFontSize', termFs.toFixed(2));
}
const history = [];
let histIdx = -1;
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function colorize(line){
  let s = escHtml(line);
  s = s.replace(/^(\[\d{2}:\d{2}:\d{2}\]|\[\+\d{2}:\d{2}:\d{2}\])/, '<span class="t-time">$1</span>');
  s = s.replace(/(\[(?:Thermal|Warmup)\])/gi, '<span class="t-thm">$1</span>');
  s = s.replace(/(\[WEATHER\])/gi, '<span class="t-wth">$1</span>');
  s = s.replace(/(\[BLE\])/gi, '<span class="t-ble">$1</span>');
  s = s.replace(/(\[(?:Time|INIT)\])/gi, '<span class="t-tim">$1</span>');
  s = s.replace(/(\[(?:Passport\]))/gi, '<span class="t-pas">$1</span>');
  s = s.replace(/(\[(?:TEST-SUITE|TEST)\])/gi, '<span class="t-tst">$1</span>');
  s = s.replace(/(\[(?:DIAG|DTC-[^\]]+|POST)\])/gi, '<span class="t-dia">$1</span>');
  s = s.replace(/(\[(?:[A-Z]\.\s*)?(?:CMD|Ready|STATUS|SYSTEM|BOILER|HARDWARE|PROTECTIONS|SAFETY|WEATHER|ZONES|Zone\s*\d+|HEATING|SENSORS|CPU|MEMORY|FLASH)[^\]]*\])/gi, '<span class="t-cmd">$1</span>');
  s = s.replace(/(\s\|\s\*)/g, ' <span class="t-time">|</span> *');
  s = s.replace(/(\[(?:EXCELLENT|EXC)\])/g, '<span class="b-exc">$1</span>');
  s = s.replace(/(\[GOOD\])/g, '<span class="b-good">$1</span>');
  s = s.replace(/(\[MARGINAL\])/g, '<span class="b-marg">$1</span>');
  s = s.replace(/(\[(?:POOR|DEGRADED)\])/g, '<span class="b-poor">$1</span>');
  s = s.replace(/(\b(?:ERROR|FAIL|FAILED|CRITICAL)\b)/gi, '<span class="t-err">$1</span>');
  s = s.replace(/(\b(?:Warning|WARN)\b)/gi, '<span class="t-wrn">$1</span>');
  s = s.replace(/(\b(?:PASS|ONLINE|CONNECTED|ENABLED|RUNNING|STARTED|ACTIVE|OPEN|ON)\b)(?!-)/gi, '<span class="t-ok">$1</span>');
  s = s.replace(/(\b(?:OFFLINE|DISCONNECTED|DISABLED|STOPPED|CLOSED|OFF|TIMEOUT)\b)/gi, '<span class="t-off">$1</span>');
  s = s.replace(/(\b(?:IDLE|STANDBY)\b)/gi, '<span class="t-idle">$1</span>');
  s = s.replace(/(\b(?:DEMAND|HEATING)\b)/gi, '<span class="t-demand">$1</span>');
  s = s.replace(/(\b(?:AUTOMATIC|AUTO|Autumn|Toamna|Winter|Iarna|Spring|Primavara|Summer|Vara)\b)/gi, '<span class="t-auto">$1</span>');
  s = s.replace(/(\b(?:MANUAL)\b)/gi, '<span class="t-man">$1</span>');
  s = s.replace(/(\b(?:WARMUP|SYNCING)\b|Scanning\.\.\.)/gi, '<span class="t-warm">$1</span>');
  s = s.replace(/(-?\d+\.?\d*\s*°C)/g, '<span class="t-temp">$1</span>');
  return s;
}
function renderLogs(txt){
  if(!txt||txt.length===0)return;
  const lines=txt.split('\n');
  let html='';
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(i===lines.length-1&&line==='')continue;
    if(line.indexOf('[CMD] > ')!==-1){
      html+='<div class="log-line cmd-start">'+colorize(line)+'</div>';
    }else if(line.indexOf('[CMD] < END')!==-1){
      html+='<div class="log-line cmd-end">'+colorize(line)+'</div>';
    }else if(line.indexOf('====')!==-1||line.indexOf('----')!==-1){
      html+='<div class="log-line t-sep">'+colorize(line)+'</div>';
    }else{
      html+='<div class="log-line">'+colorize(line)+'</div>';
    }
  }
  term.insertAdjacentHTML('beforeend',html);
  while(term.children.length>2000)term.removeChild(term.firstChild);
  if(autoScroll.checked)term.scrollTop=term.scrollHeight;
}
function scheduleNextPoll(delayMs){
  if(pollTimer)clearTimeout(pollTimer);
  pollTimer=setTimeout(fetchLogs,delayMs!==undefined?delayMs:3000);
}
async function fetchLogs(){
  if(isFetching||isSending)return;
  isFetching=true;
  fetchAbortCtrl=new AbortController();
  try{
    const r=await fetch(base+'/api/console/logs?since='+lastSeq,{signal:fetchAbortCtrl.signal});
    if(!r.ok||r.status!==200)throw new Error('HTTP '+r.status);
    const seqHdr=r.headers.get('X-Log-Seq');
    const newSeq=seqHdr?parseInt(seqHdr,10):0;
    if(newSeq===0&&lastSeq>0){
      term.innerHTML='';
      lastSeq=0;
    }else if(lastSeq>0&&newSeq>0&&newSeq<lastSeq){
      term.insertAdjacentHTML('beforeend','<div class="log-line" style="color:#38bdf8;font-weight:bold;border-top:1px dashed #374151;margin:8px 0;padding-top:4px;">--- [SYSTEM REBOOT DETECTED / NEW FIRMWARE RUNNING] ---</div>');
    }
    if(newSeq>0)lastSeq=newSeq;
    const txt=await r.text();
    renderLogs(txt);
    const b=document.getElementById('statusBadge');
    if(b){b.textContent='CONNECTED';b.style.background='#065f46';}
  }catch(e){
    if(e.name!=='AbortError'){
      const b=document.getElementById('statusBadge');
      if(b){b.textContent='DISCONNECTED';b.style.background='#7f1d1d';}
    }
  }finally{
    isFetching=false;
    fetchAbortCtrl=null;
    if(!isSending){
      scheduleNextPoll(document.hidden?8000:3000);
    }
  }
}
async function sendCmd(c){
  if(!c||isSending)return;
  const upper=(c||'').trim().toUpperCase();
  if(upper==='CLEAR'||upper==='CLS'){
    term.innerHTML='';
    lastSeq=0;
  }
  if(pollTimer){
    clearTimeout(pollTimer);
    pollTimer=null;
  }
  if(fetchAbortCtrl){
    try{fetchAbortCtrl.abort();}catch(_){}
    fetchAbortCtrl=null;
  }
  isFetching=false;
  isSending=true;
  history.unshift(c);
  histIdx=-1;
  const b=document.getElementById('statusBadge');
  if(b){b.textContent='RUNNING...';b.style.background='#d97706';}
  try{
    const r=await fetch(base+'/api/console/send?since='+lastSeq+'&cmd='+encodeURIComponent(c),{method:'POST'});
    if(r.ok){
      const seqHdr=r.headers.get('X-Log-Seq');
      const newSeq=seqHdr?parseInt(seqHdr,10):0;
      if(newSeq===0){
        term.innerHTML='';
        lastSeq=0;
      }else if(newSeq>0){
        lastSeq=newSeq;
      }
      const txt=await r.text();
      renderLogs(txt);
      if(b){b.textContent='CONNECTED';b.style.background='#065f46';}
    }
  }catch(e){
    console.error(e);
    if(b){b.textContent='ERROR';b.style.background='#7f1d1d';}
  }finally{
    isSending=false;
    scheduleNextPoll(3500);
  }
}
function handleSubmit(e){
  e.preventDefault();
  const val=cmdInput.value.trim();
  if(val){
    sendCmd(val);
    cmdInput.value='';
  }
}
function clearTerm(){
  term.innerHTML='';
  lastSeq=0;
  sendCmd('CLEAR');
}
cmdInput.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowUp'){
    if(histIdx+1<history.length){
      histIdx++;
      cmdInput.value=history[histIdx];
    }
    e.preventDefault();
  }else if(e.key==='ArrowDown'){
    if(histIdx>0){
      histIdx--;
      cmdInput.value=history[histIdx];
    }else{
      histIdx=-1;
      cmdInput.value='';
    }
    e.preventDefault();
  }
});
fetchLogs();
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!isFetching&&!isSending){
    scheduleNextPoll(200);
  }
});
</script>
</body></html>
