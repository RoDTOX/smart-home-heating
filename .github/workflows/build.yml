name: build

on:
  push:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run
      # On main the merge-base with origin/main is HEAD itself, so diff against the previous push instead.
      - run: python tools/sh_process_check.py --base "$BASE" --require-firmware
        env:
          BASE: ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
