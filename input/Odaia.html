<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Odaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E4E9E6; --panel:#F8FAF9; --panel2:#EEF2F0; --ink:#16201B; --ink2:#48554E; --ink3:#86928B; --line:#D1D9D4;
  --accent:#2152D1; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --warn:#9A6200; --warn-soft:#FBEFD3; --bad:#B8321F; --bad-soft:#F9DFDA; --good:#1B7A4C; --good-soft:#DAF0E3;
  --plan-bg:#FCFDFC; --plan-grid:#EDF1EF; --plan-grid2:#D6DED9; --wall:#232C27; --view-bg:#D7DFDA; --ground:#C9D2CD;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D110F; --panel:#161B18; --panel2:#1D2420; --ink:#E2E9E5; --ink2:#A6B2AB; --ink3:#6C7872; --line:#2A332E;
    --accent:#7F9FFF; --accent-ink:#0A1024; --accent-soft:#1E2946;
    --warn:#E3A93E; --warn-soft:#382C12; --bad:#F27B69; --bad-soft:#3B1D18; --good:#5CC98F; --good-soft:#15301F;
    --plan-bg:#121714; --plan-grid:#1A201C; --plan-grid2:#2A332E; --wall:#D4DCD7; --view-bg:#1A201C; --ground:#232A26;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D110F; --panel:#161B18; --panel2:#1D2420; --ink:#E2E9E5; --ink2:#A6B2AB; --ink3:#6C7872; --line:#2A332E;
  --accent:#7F9FFF; --accent-ink:#0A1024; --accent-soft:#1E2946;
  --warn:#E3A93E; --warn-soft:#382C12; --bad:#F27B69; --bad-soft:#3B1D18; --good:#5CC98F; --good-soft:#15301F;
  --plan-bg:#121714; --plan-grid:#1A201C; --plan-grid2:#2A332E; --wall:#D4DCD7; --view-bg:#1A201C; --ground:#232A26;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-columns:minmax(300px,31%) minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px;padding-inline:16px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand .mark svg{width:22px;height:22px}
.brand h1{margin:0;font:800 21px/1 var(--f-display);letter-spacing:-.01em}
.brand .meta{display:flex;flex-direction:column;min-width:0}
.brand small{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top .spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:13px;font-weight:500}
.tbtn:hover{color:var(--ink);border-color:var(--ink3)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn.icon{width:34px;padding:0;justify-content:center}
.group{display:flex;gap:4px}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane-head h2{margin:0;font:600 15px/1.2 var(--f-display);letter-spacing:.01em}
.pane-head small{color:var(--ink3);font-size:12px}
.pane-head .tools{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink2);font-size:12.5px;font-weight:500}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tool svg.i{width:16px;height:16px}

.plan-wrap{position:relative;flex:1;min-height:0;background:var(--plan-bg)}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.plan-hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--ink3);background:color-mix(in srgb,var(--plan-bg) 88%,transparent);padding:4px 8px;border-radius:7px;pointer-events:none;max-width:calc(100% - 20px)}

.view-pane{position:relative}
.view-wrap{position:relative;flex:1;min-height:0;background:var(--view-bg)}
.view-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ov{position:absolute;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.ov>*{pointer-events:auto}
.ov.tl{left:10px;top:10px;right:120px}
.ov.tr{right:10px;top:10px}
.ov.bl{left:10px;bottom:10px;right:10px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg .lbl{font-size:11px;color:var(--ink3);padding:0 4px 0 6px;align-self:center;text-transform:uppercase;letter-spacing:.06em}
.help{font-size:12px;color:var(--ink2);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:9px;padding:6px 10px;backdrop-filter:blur(6px)}
.help kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
.crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;opacity:.7}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
.crosshair::before{left:6px;top:0;width:2px;height:14px}.crosshair::after{top:6px;left:0;height:2px;width:14px}
#joy{position:absolute;left:18px;bottom:56px;width:110px;height:110px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);background:color-mix(in srgb,var(--panel) 45%,transparent);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);opacity:.55}
.boot{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px;text-align:center;padding:20px}

.side{display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 9px 9px;font-size:13px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-body{flex:1;overflow:auto;padding:12px 14px 16px;min-height:0}
.tab-body h3{font:600 14px/1.25 var(--f-display);margin:0 0 6px;letter-spacing:.01em}
.tab-body p{margin:0 0 10px;color:var(--ink2);font-size:13px}
.sec{padding:12px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.lbl-up{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 7px}

.search{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;margin-bottom:9px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;height:26px;padding:0 10px;font-size:12px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.cat-card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:grab;user-select:none}
.cat-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.cat-card canvas{width:60px;height:46px}
.cat-card b{font-size:12px;font-weight:500;line-height:1.2}
.cat-card small{font:400 10.5px var(--f-mono);color:var(--ink3)}

.ph{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.ph .t{flex:1;min-width:0}
.ph b{font:600 16px/1.2 var(--f-display);display:block}
.ph small{color:var(--ink3);font-size:12px}
.acts{display:flex;gap:4px}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2)}
.ibtn:hover{color:var(--ink);border-color:var(--ink3)}
.ibtn.danger:hover{color:var(--bad);border-color:var(--bad)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label{font-size:11.5px;color:var(--ink3)}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2);height:32px;padding:0 8px 0 0;min-width:0}
.num input{border:0;background:transparent;width:100%;min-width:0;height:100%;padding:0 0 0 8px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.num input:focus{outline:none}
.num:focus-within{border-color:var(--accent)}
.num span{font-size:11px;color:var(--ink3)}
.txt{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:0 9px}
textarea.txt{height:auto;padding:7px 9px;resize:vertical;font-size:13px}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-row output{font:500 12px var(--f-mono);min-width:44px;text-align:right;color:var(--ink2)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background-size:cover;background-position:center;position:relative;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.sw.plain{display:grid;place-items:center;font-size:10px;color:var(--ink3);background:var(--panel2)}
.sw.col{width:22px;height:22px;border-radius:50%}
.colorin{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:9px}
.toggles{display:flex;gap:4px;flex-wrap:wrap}
.tg{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);font-size:12px;color:var(--ink2)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.empty{color:var(--ink3);font-size:13px;padding:18px 4px;text-align:center}
.note{font-size:12px;color:var(--ink3);margin-top:6px}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line);border-radius:11px;padding:16px 10px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--panel2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop small{color:var(--ink3);font-size:11.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);padding:0;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;padding:0}
.status{font-size:12.5px;color:var(--ink2);margin:8px 0 0;min-height:1em}
.status.err{color:var(--bad)}
.ai-card{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(180deg,var(--accent-soft),transparent 70%);border-radius:12px;padding:12px}
details summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:4px 0}

.checks{border-top:1px solid var(--line);padding:9px 14px 11px;max-height:34%;overflow:auto;flex:none}
.checks h4{margin:0 0 6px;font:600 12px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:6px}
.checks h4 .cnt{font:500 11px var(--f-mono);padding:1px 6px;border-radius:99px;background:var(--panel2);color:var(--ink2);letter-spacing:0}
.checks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:6px 8px;border-radius:8px;cursor:pointer;line-height:1.35}
.checks li.warn{background:var(--warn-soft);color:var(--warn)}
.checks li.bad{background:var(--bad-soft);color:var(--bad)}
.checks li.ok{background:var(--good-soft);color:var(--good);cursor:default}
.checks li .dot{width:7px;height:7px;border-radius:50%;background:currentColor;margin-top:5px;flex:none}

.modal{position:fixed;inset:0;background:rgba(8,12,10,.5);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{width:min(980px,100%)}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header h3{margin:0;font:600 16px var(--f-display);flex:1}
.sheet .body{padding:14px;overflow:auto;min-height:0}
.sheet footer{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photo-stage{position:relative;height:min(58vh,560px);background:#111;min-height:220px}
.photo-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pick-sw{width:34px;height:34px;border-radius:8px;border:1px solid var(--line)}
.shot{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

@media (max-width:1180px){
  #app{grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto minmax(380px,58vh) minmax(460px,1fr);height:auto;min-height:100%}
  html,body{height:auto}
  .view-pane{grid-column:1/-1;grid-row:2}
  .plan-pane{grid-row:3}
  .side{grid-row:3}
}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .view-pane{grid-row:auto;height:62vh;min-height:340px;order:1}
  .plan-pane{grid-row:auto;height:430px;order:2}
  .side{grid-row:auto;min-height:480px;order:3}
  .brand small{max-width:60vw}
  .ov.tl{right:10px}
  .ov.tr{top:auto;bottom:52px}
  .tbtn .t{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 21 8v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/><path d="M7.5 12.5v4" opacity=".6"/></svg></div>
      <div class="meta"><h1>Odaia</h1><small id="projMeta">—</small></div>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="tbtn icon" id="bUndo" title="Anulează (Ctrl+Z)" aria-label="Anulează"></button>
      <button class="tbtn icon" id="bRedo" title="Refă (Ctrl+Y)" aria-label="Refă"></button>
    </div>
    <button class="tbtn" id="bNight" title="Comută zi / noapte"></button>
    <button class="tbtn" id="bShot" title="Captură din vederea 3D"></button>
    <button class="tbtn primary" id="bExport" title="Salvează sau exportă proiectul"></button>
  </header>

  <section class="pane plan-pane" aria-label="Plan 2D">
    <div class="pane-head">
      <h2>Plan</h2><small id="planDims"></small>
      <div class="tools" id="planTools"></div>
    </div>
    <div class="plan-wrap" id="planWrap">
      <canvas id="plan"></canvas>
      <div class="plan-hint" id="planHint"></div>
    </div>
  </section>

  <section class="pane view-pane" aria-label="Vedere 3D">
    <div class="view-wrap" id="viewWrap">
      <div class="boot" id="boot">Se încarcă motorul 3D…</div>
      <div class="ov tl">
        <div class="seg" id="modeSeg" role="group" aria-label="Mod vedere"></div>
        <div class="seg" id="wallSeg" role="group" aria-label="Pereți"></div>
      </div>
      <div class="ov tr"><div class="seg" id="camSeg"></div></div>
      <div class="ov bl"><div class="help" id="help"></div></div>
      <div class="crosshair" id="cross" hidden></div>
      <div id="joy" hidden><i></i></div>

  </section>

  <aside class="pane side" aria-label="Panou">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="catalog" aria-selected="true">Catalog</button>
      <button role="tab" data-tab="props" aria-selected="false">Proprietăți</button>
      <button role="tab" data-tab="photos" aria-selected="false">Din poze</button>
      <button role="tab" data-tab="project" aria-selected="false">Proiect</button>
    </div>
    <div class="tab-body" id="tab-catalog"></div>
    <div class="tab-body" id="tab-props" hidden></div>
    <div class="tab-body" id="tab-photos" hidden></div>
    <div class="tab-body" id="tab-project" hidden></div>
    <div class="checks" id="checks"></div>
  </aside>
</div>

<div class="modal" id="mGeneric" hidden><div class="sheet" id="mGenericSheet"></div></div>
<div class="modal" id="mPhoto" hidden>
  <div class="sheet wide">

  photoCv.width = W * dpr; photoCv.height = H * dpr; phx.setTransform(dpr, 0, 0, dpr, 0, 0); phx.fillStyle = '#111'; phx.fillRect(0, 0, W, H);
  const img = PH.p.img, s = Math.min(W / img.naturalWidth, H / img.naturalHeight), ox = (W - img.naturalWidth * s) / 2, oy = (H - img.naturalHeight * s) / 2;
  PH.fit = { s, ox, oy }; phx.drawImage(img, ox, oy, img.naturalWidth * s, img.naturalHeight * s);
  if (PH.sel && PH.mode === 'crop') {
    const [x0, y0, x1, y1] = normRect([PH.sel[0], PH.sel[1]], [PH.sel[2], PH.sel[3]]);
    phx.fillStyle = 'rgba(0,0,0,.5)'; phx.beginPath(); phx.rect(0, 0, W, H); phx.rect(ox + x0 * s, oy + y0 * s, (x1 - x0) * s, (y1 - y0) * s); phx.fill('evenodd');
    phx.strokeStyle = '#fff'; phx.lineWidth = 1.5; phx.setLineDash([6, 4]); phx.strokeRect(ox + x0 * s, oy + y0 * s, (x1 - x0) * s, (y1 - y0) * s); phx.setLineDash([]);
  }
}
function photoPt(e) { const r = photoCv.getBoundingClientRect(), f = PH.fit; return [clamp((e.clientX - r.left - f.ox) / f.s, 0, PH.p.img.naturalWidth), clamp((e.clientY - r.top - f.oy) / f.s, 0, PH.p.img.naturalHeight)]; }
let phDrag = false;
photoCv.addEventListener('pointerdown', e => {
  if (!PH.p) return; const [x, y] = photoPt(e);
  if (PH.mode === 'pick') { const d = PH.base.getContext('2d').getImageData(clamp(Math.round(x) - 2, 0, PH.base.width - 5), clamp(Math.round(y) - 2, 0, PH.base.height - 5), 5, 5).data; let r = 0, g = 0, b = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; } const n = d.length / 4; PH.color = '#' + [r / n, g / n, b / n].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); renderPhotoFoot(); return; }
  capPtr(photoCv, e.pointerId); phDrag = true; PH.sel = [x, y, x, y]; PH.tex = null; drawPhoto();
});
photoCv.addEventListener('pointermove', e => { if (!phDrag) return; const [x, y] = photoPt(e); PH.sel[2] = x; PH.sel[3] = y; drawPhoto(); });
photoCv.addEventListener('pointerup', () => { if (phDrag) { phDrag = false; renderPhotoFoot(); } });
function selTargets() {
  const s = UI.sel, out = [];
  if (s && s.kind === 'item') out.push(['item', 'Pe obiectul selectat']);
  if (s && s.kind === 'wall') out.push(['wall', 'Pe peretele selectat']);
  const r = targetRoom(); if (r) { out.push(['floor', `Pe podeaua: ${r.name}`]); out.push(['roomWalls', `Pe toți pereții: ${r.name}`]); }
  return out;
}
function targetRoom() { const s = UI.sel; if (!s) return S.rooms[0] || null; if (s.kind === 'room') return findRoom(s.id); if (s.kind === 'wall') return findRoom(s.room); if (s.kind === 'item') { const it = findItem(s.id); return roomAt(it.x, it.z) || S.rooms[0]; } return S.rooms[0] || null; }
function applySpecTo(target, sp) {
  const s = UI.sel, r = targetRoom();
  if (target === 'item' && s && s.kind === 'item') { const it = findItem(s.id); it.c = sp.c; it.t = sp.t || ''; it.s = sp.s || 0; rebuildItem(it.id); }
  else if (target === 'wall' && s && s.kind === 'wall') { const rr = findRoom(s.room); rr.wallSides = { ...(rr.wallSides || {}), [s.side]: sp }; buildArch(); }
  else if (target === 'floor' && r) { r.floor = sp; buildArch(); }
  else if (target === 'roomWalls' && r) { r.walls = sp; r.wallSides = {}; buildArch(); }
  drawPlan(); renderProps(); commit(); toast('Aplicat');
}
function renderPhotoFoot() {
  const f = $('#photoFoot'), tg = selTargets();
  const tgHtml = tg.length ? tg.map(([k, l]) => `<button class="btn sm" data-apply="${k}">${esc(l)}</button>`).join('') : '<span class="note">Selectează un obiect, un perete sau o cameră ca să aplici.</span>';
  if (PH.mode === 'pick') {
    f.innerHTML = PH.color ? `<span class="pick-sw" style="background:${PH.color}"></span><code style="font-family:var(--f-mono)">${PH.color}</code><span style="flex:1"></span>${tgHtml}` : '<span class="note">Dă clic pe poză pentru a lua culoarea (media a 5×5 pixeli).</span>';
  } else {
    const has = PH.sel && Math.abs(PH.sel[2] - PH.sel[0]) > 8 && Math.abs(PH.sel[3] - PH.sel[1]) > 8;
    f.innerHTML = !has ? '<span class="note">Trage un dreptunghi peste o zonă cu model uniform (parchet, gresie, tapet, material). Alege o zonă din apropierea camerei, unde perspectiva e mai puțin înclinată.</span>'
      : `<div class="field" style="width:150px"><label for="cropW">Lățimea reală a zonei</label><div class="num"><input type="number" id="cropW" value="${window.__cropW || 60}" step="5" min="5"><span>cm</span></div></div>
         ${PH.tex ? `<span class="note">Textura e salvată.</span><span style="flex:1"></span>${tgHtml}` : `<span style="flex:1"></span><button class="btn primary" id="cropSave">Salvează textura</button>`}`;
    const cw = $('#cropW'); if (cw) cw.addEventListener('input', () => { window.__cropW = +cw.value || 60; if (PH.tex && S.textures[PH.tex]) S.textures[PH.tex].s = (window.__cropW) / 100; });
  }
}
$('#photoFoot').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'cropSave') {
    const [x0, y0, x1, y1] = normRect([PH.sel[0], PH.sel[1]], [PH.sel[2], PH.sel[3]]); const w = x1 - x0, h = y1 - y0, a = clamp(h / w, .2, 5);
    const c = mkCanvas(512, Math.round(512 * a)); c.getContext('2d').drawImage(PH.base, x0, y0, w, h, 0, 0, c.width, c.height);
    const id = uid(); S.textures[id] = { n: `Foto ${Object.keys(S.textures).length + 1}`, url: c.toDataURL('image/jpeg', .85), a, s: (window.__cropW || 60) / 100, avg: avgOfCanvas(c) };
    PH.tex = id; commit(); renderPhotoFoot(); renderPhotos(); if (UI.tab === 'props') renderProps(); return;
  }
  const t = b.dataset.apply; if (!t) return;
  if (PH.mode === 'pick') { applySpecTo(t, { c: PH.color, t: '' }); return; }
  if (PH.tex) { const rec = S.textures[PH.tex]; applySpecTo(t, { c: '#ffffff', t: 'p:' + PH.tex, s: rec.s }); }
});
window.addEventListener('resize', () => { if (!$('#mPhoto').hidden) drawPhoto(); });

/* ============================== project tab ============================== */
function renderProject() {
  const el = $('#tab-project');
  el.innerHTML = `<div class="stack">
    <div class="field"><label for="pj-name">Numele proiectului</label><input class="txt" id="pj-name" data-pj="name" value="${esc(S.name)}"></div>
    <div class="grid3">
      <div class="field"><label for="pj-wallH">Tavan</label><div class="num"><input type="number" id="pj-wallH" data-pj="wallH" value="${cm(S.wallH)}" step="5"><span>cm</span></div></div>
      <div class="field"><label for="pj-wallT">Grosime perete</label><div class="num"><input type="number" id="pj-wallT" data-pj="wallT" value="${cm(S.wallT)}" step="1"><span>cm</span></div></div>
      <div class="field"><label for="pj-eye">Ochi (pers. I)</label><div class="num"><input type="number" id="pj-eye" data-pj="eye" value="${cm(S.eye)}" step="1"><span>cm</span></div></div>
    </div>
    <div class="field"><label for="pj-ext">Culoarea fațadei</label><div class="row"><input class="colorin" type="color" id="pj-ext" data-pj="exterior" value="${S.exterior}"></div></div>
  </div>
  <div class="sec"><h3>Pornește de la</h3><p>Înlocuiește proiectul curent. Poți reveni oricând cu Anulează.</p>
    <div class="row"><button class="btn sm" data-sample="mine">Apartamentul nostru</button><button class="btn sm" data-sample="apt">Apartament 2 camere</button><button class="btn sm" data-sample="kids">Camera copilului</button><button class="btn sm" data-sample="empty">Cameră goală</button></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="addRoomSide">${ic('plus')} Cameră nouă lipită la est</button></div></div>
  <div class="sec"><h3>Salvare și partajare</h3><p>Proiectul se salvează automat în acest browser. Pentru alt dispozitiv, exportă-l ca JSON și importă-l acolo.</p>
    <div class="row"><button class="btn sm" id="pjExport">${ic('save')} Exportă JSON</button><label class="btn sm" for="pjImport">Importă JSON<input type="file" id="pjImport" accept=".json,application/json" hidden></label></div></div>
  <div class="sec"><h3>Scurtături</h3><p style="font-family:var(--f-mono);font-size:12px;line-height:1.8">R rotește · Del șterge · Ctrl+D duplică · săgeți = mută 1 cm (Shift 10 cm) · C cameră · U ușă · F fereastră · Ctrl+Z / Ctrl+Y · Alt la tragere = fără lipire de perete · dublu clic pe podea în 3D = intră la persoana I</p></div>`;
}
$('#tab-project').addEventListener('input', e => {
  const k = e.target.dataset.pj; if (!k) return;
  if (k === 'name') { S.name = e.target.value; updateMeta(); commitSoon(); return; }
  if (k === 'exterior') { S.exterior = e.target.value; buildArch(); commitSoon(); return; }
  const v = parseFloat(e.target.value); if (!isFinite(v)) return;
  if (k === 'wallH') S.wallH = clamp(v / 100, 2, 5); if (k === 'wallT') S.wallT = clamp(v / 100, .05, .5); if (k === 'eye') S.eye = clamp(v / 100, .8, 2.1);
  rebuildAll(); drawPlan(); commitSoon();
});
$('#tab-project').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sample) { replaceProject(b.dataset.sample === 'mine' ? sampleMine() : b.dataset.sample === 'apt' ? sampleApartment() : b.dataset.sample === 'kids' ? sampleKids() : sampleEmpty()); toast('Proiect încărcat'); }
  else if (b.id === 'addRoomSide') { const bb = houseBounds(); const r = R_(`Camera ${S.rooms.length + 1}`, bb.x1, bb.z0, 3, Math.min(3.5, bb.z1 - bb.z0 || 3.5), { c: '#ffffff', t: 'oak' }, { c: '#EEE9E0', t: 'plaster' }); S.rooms.push(r); buildArch(); fitPlan(); select({ kind: 'room', id: r.id }, true); commit(); }
  else if (b.id === 'pjExport') exportProject();
});
$('#tab-project').addEventListener('change', async e => {
  if (e.target.id !== 'pjImport') return; const f = e.target.files[0]; if (!f) return;
  try { const txt = await f.text(); const msg = importLayout(JSON.parse(txt)); toast(msg); } catch (err) { toast('Fișierul nu e un proiect valid: ' + (err.message || err)); }
});
async function exportProject() {
  const json = JSON.stringify(S, null, 1), fname = (S.name || 'odaia').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').toLowerCase() + '.json';
  openModal('Exportă proiectul', `<p>Salvează fișierul sau copiază textul. Îl poți importa din tabul Proiect, pe orice dispozitiv.</p><textarea class="txt" id="expArea" rows="9" readonly>${esc(json)}</textarea>`,
    `${downloads ? '<button class="btn primary" id="expSave">Salvează fișierul</button>' : ''}<button class="btn" id="expCopy">Copiază</button><span class="note" id="expNote"></span>`);
  $('#expCopy').onclick = () => copyText(json, $('#expCopy'));
  if (downloads) $('#expSave').onclick = async () => { try { await downloads.save({ filename: fname, data: json }); $('#expNote').textContent = 'Salvat.'; } catch (err) { $('#expNote').textContent = err && err.code === 'declined' ? 'Salvare anulată.' : 'Salvarea nu e disponibilă aici; folosește Copiază.'; } };
}
function takeShot() {
  renderer.render(scene, camera); const url = renderer.domElement.toDataURL('image/png');

  if (downloads) $('#shotSave').onclick = () => renderer.domElement.toBlob(async blob => { try { await downloads.save({ filename: 'odaia-3d.png', data: blob }); $('#shotNote').textContent = 'Salvat.'; } catch (err) { $('#shotNote').textContent = err && err.code === 'declined' ? 'Salvare anulată.' : 'Salvarea nu e disponibilă; folosește clic dreapta pe imagine.'; } }, 'image/png');
}
function openModal(title, body, foot) {
  $('#mGenericSheet').innerHTML = `<header><h3>${esc(title)}</h3><button class="ibtn" data-close aria-label="Închide">✕</button></header><div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ''}`;

}
function closeModal() { $('#mGeneric').hidden = true; }
$('#mGeneric').addEventListener('click', e => { if (e.target.id === 'mGeneric' || e.target.closest('[data-close]')) closeModal(); });

/* ============================== chrome ============================== */
let toastT = 0;

function updateUndo() { $('#bUndo').disabled = hist.i <= 0; $('#bRedo').disabled = hist.i >= hist.stack.length - 1; }
function updateMeta() {
  const area = S.rooms.reduce((a, r) => a + r.w * r.d, 0);
  $('#projMeta').textContent = `${S.name} · ${S.rooms.length} ${S.rooms.length === 1 ? 'cameră' : 'camere'} · ${fmtM(area)} m²`;
  $('#planDims').textContent = `${S.items.length} obiecte`;
}
function renderViewControls() {
  $('#modeSeg').innerHTML = [['orbit', 'orbit', 'Orbită'], ['fp', 'eye', 'Persoana I'], ['tp', 'person', 'Persoana a III-a']].map(([k, i, l]) => `<button data-mode="${k}" aria-pressed="${UI.mode === k}">${ic(i)}<span>${l}</span></button>`).join('');
  $('#wallSeg').hidden = UI.mode !== 'orbit';
  $('#wallSeg').innerHTML = `<span class="lbl">Pereți</span>` + [['cut', 'Tăiați'], ['full', 'Întregi'], ['low', 'Joși']].map(([k, l]) => `<button data-walls="${k}" aria-pressed="${UI.walls === k}">${l}</button>`).join('');
  $('#camSeg').hidden = UI.mode !== 'orbit';
  $('#camSeg').innerHTML = `<button data-cam="iso" title="Vedere de ansamblu">${ic('cube')}</button><button data-cam="top" title="Vedere de sus">${ic('top')}</button>`;
  $('#help').innerHTML = UI.mode === 'orbit'
    ? 'Trage = rotește · clic dreapta / 2 degete = mută · rotiță = zoom · trage mobila direct în 3D · <b>dublu clic pe podea</b> = intră în cameră'
    : `<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / săgeți = mers · <kbd>Shift</kbd> = alergi · trage = privești · dublu clic = blochează mouse-ul · <kbd>Esc</kbd> = ieșire${matchMedia('(pointer: coarse)').matches ? ' · joystick stânga jos' : ''}`;
  setTool(UI.tool);
}
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
$('#wallSeg').addEventListener('click', e => { const b = e.target.closest('[data-walls]'); if (b) { UI.walls = b.dataset.walls; renderViewControls(); } });
$('#camSeg').addEventListener('click', e => { const b = e.target.closest('[data-cam]'); if (b) frameCamera(b.dataset.cam); });
function renderTopButtons() {
  $('#bUndo').innerHTML = ic('undo'); $('#bRedo').innerHTML = ic('redo');
  $('#bNight').innerHTML = `${ic(UI.night ? 'sun' : 'moon')}<span class="t">${UI.night ? 'Zi' : 'Noapte'}</span>`;

  $('#bExport').innerHTML = `${ic('save')}<span class="t">Exportă</span>`;
}
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bNight').onclick = () => { UI.night = !UI.night; applyLighting(); renderTopButtons(); };
$('#bShot').onclick = takeShot; $('#bExport').onclick = exportProject;
$('#planTools').innerHTML = [['select', 'cursor', 'Selectează'], ['room', 'room', 'Cameră'], ['door', 'door', 'Ușă'], ['window', 'window', 'Fereastră']].map(([k, i, l]) => `<button class="tool" data-tool="${k}" aria-pressed="${k === 'select'}" title="${l}">${ic(i)}<span>${l}</span></button>`).join('') + `<button class="tool" id="bFit" title="Încadrează planul">${ic('fit')}</button>`;
$('#planTools').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b) setTool(b.dataset.tool); if (e.target.closest('#bFit')) fitPlan(); });
const themeObs = () => { PC = {}; readPlanColors(); applyTheme(); if (UI.tab === 'catalog') renderCatalog(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeObs);
new MutationObserver(themeObs).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ============================== loop & boot ============================== */
function sizeView() { const w = viewWrap.clientWidth, h = viewWrap.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(sizeView).observe(viewWrap);
new ResizeObserver(sizePlan).observe($('#planWrap'));
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (UI.mode === 'orbit') { controls.update(); } else updateWalk(dt);
  updateCutaway();
  renderer.render(scene, camera);
  if (planDirty) renderPlan();
  requestAnimationFrame(loop);
}
S = loadSaved();
// the first demo (4 rooms) may have been renamed; recognise it by its rooms and replace it with the real apartment
const isOldDemo = p => p.rooms.length === 4 && ['Living + bucătărie', 'Dormitor', 'Hol', 'Baie'].every(n => p.rooms.some(r => r.name === n));
if (!S || /\(exemplu\)/.test(S.name) || isOldDemo(S) || (S.name === 'Apartamentul nostru' && (S.rev || 1) < 2)) S = sampleMine();
readPlanColors();
renderTopButtons(); renderViewControls(); renderCatalog(); renderProps(); renderProject();
rebuildAll(); applyLighting(); sizeView(); sizePlan(); frameCamera('iso');
commit(); updateChecks(); updateMeta();
requestAnimationFrame(loop);
initCaps();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawPlan());
window.addEventListener('error', ev => { console.error(ev.error || ev.message); });
</script>
