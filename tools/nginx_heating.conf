server {
    listen 8088;

    auth_basic "Smart Heating Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;


    # 1. ESP32 Specific API calls
    location ~ ^/api/(zones|boiler|mode|setup|console|history) {
        proxy_pass http://192.168.1.20:80;
        proxy_set_header Host 192.168.1.20;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 2. Standalone Classic HTML Web Interface
    location /classic/ {
        alias /mnt/c/Users/BSeceleanu/.github_repos/smart-heating/web/;
        index index.html;
    }

    # 3. Galaxy-A6 Central Nexus Portal & Services (Tesla, Aquarium, Grafana)
    location /nexus/ {
        proxy_pass http://192.168.1.28:8088/;
        proxy_set_header Host 192.168.1.28;
        proxy_buffering off;
    }
    location = /nexus {
        return 301 /nexus/;
    }

    location /aquarium/ {
        proxy_pass http://192.168.1.28:8088/aquarium/;
        proxy_set_header Host 192.168.1.28;
    }

    location /teslamate/ {
        proxy_pass http://192.168.1.28:8088/teslamate/;
        proxy_set_header Host 192.168.1.28;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /grafana/ {
        proxy_pass http://192.168.1.28:8088/grafana/;
        proxy_set_header Host 192.168.1.28;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 4. Home Assistant (Root + WebSockets + Auth)
    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
