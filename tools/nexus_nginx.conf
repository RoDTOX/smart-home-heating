# ========================================================
# 1. FRONT-DOOR: mysmarthome.cc (Public Showcase - NO AUTH)
# ========================================================
server {
    listen 8088;
    server_name mysmarthome.cc www.mysmarthome.cc;

    location / {
        root /usr/share/nginx/html/public;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# 2. BACK-DOOR: ha.mysmarthome.cc & Nexus Portal (BASIC AUTH)
# ========================================================
server {
    listen 8088 default_server;
    server_name ha.mysmarthome.cc _;

    auth_basic "Smart Home Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 1. ESP32 Specific API calls
    location /api/ {
        proxy_pass http://192.168.1.20:80/api/;
        proxy_set_header Host 192.168.1.20;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 2. Standalone Classic HTML Web Interface
    location /classic/ {
        proxy_pass http://192.168.1.20:80/;
        proxy_set_header Host 192.168.1.20;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Smart Aquarium (ESP8266)
    location /aquarium/ {
        proxy_pass http://192.168.1.32:80/;
        proxy_set_header Host 192.168.1.32;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. TeslaMate Web Interface
    location /teslamate/ {
        proxy_pass http://teslamate:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. Grafana Dashboards
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 6. Central Portal (Smart Home Nexus)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
