smart_heating:
  modes:
    dark:
      # Typography
      ha-font-family: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      primary-font-family: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      code-font-family: "'JetBrains Mono', ui-monospace, Consolas, monospace"

      # Luxury Architectural Background Wallpaper
      lovelace-background: "center / cover no-repeat url('/local/background.jpg')"
      primary-background-color: "#0b0f19"
      secondary-background-color: "#111827"
      clear-background-color: "#0b0f19"

      # True Glassmorphism Frosted Glass (Cards only)
      ha-card-background: "rgba(15, 23, 42, 0.62)"
      ha-card-backdrop-filter: "blur(24px) saturate(180%)"
      ha-card-border-radius: "24px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(255, 255, 255, 0.14)"
      ha-card-box-shadow: "0 16px 40px 0 rgba(0, 0, 0, 0.45), inset 0 1px 1px 0 rgba(255, 255, 255, 0.20)"

      # Solid Surfaces for Dialogs & Dropdown Menus (prevents see-through readability bugs)
      card-background-color: "#111827"
      ha-dialog-surface-background: "#111827"
      mdc-theme-surface: "#111827"
      paper-dialog-background-color: "#111827"

      # Mushroom Seamless Glass Tweaks
      mush-card-background: "transparent"
      mush-card-border-radius: "24px"
      mush-chip-background: "rgba(255, 255, 255, 0.08)"
      mush-chip-border-radius: "14px"
      mush-chip-box-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.12)"

      # Text & High Contrast Palette
      primary-color: "#f59e0b"
      accent-color: "#f59e0b"
      primary-text-color: "#ffffff"
      secondary-text-color: "rgba(255, 255, 255, 0.75)"
      disabled-text-color: "rgba(255, 255, 255, 0.40)"
      state-inactive-color: "rgba(255, 255, 255, 0.70)"
      divider-color: "rgba(255, 255, 255, 0.12)"

      # Header & Sidebar Frosted Glass (when visible)
      app-header-background-color: "rgba(11, 15, 25, 0.45)"
      app-header-text-color: "#ffffff"
      app-header-border-bottom: "1px solid rgba(255, 255, 255, 0.12)"
      sidebar-background-color: "rgba(11, 15, 25, 0.85)"
      sidebar-text-color: "#94a3b8"
      sidebar-selected-text-color: "#f59e0b"
      sidebar-selected-icon-color: "#f59e0b"
      sidebar-icon-color: "#94a3b8"

      # States
      state-active-color: "#f59e0b"
      state-climate-heat-color: "#f59e0b"
      state-climate-idle-color: "#64748b"
