<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Home Heating — machetă panou</title>
<!-- Machetă: fonturile vin de la Google doar aici. Pe placă se includ local. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --bg:#16171b;--surface:#1f2025;--elev:#2a2b32;--border:#2f3038;--fg:#ececf1;--muted:#9a9ba6;
  --heat:#ffa63d;--glow:rgba(255,179,92,.35);--idle:#6b8cae;--ok:#3ec27a;--warn:#f2c230;
  --danger:#ef5350;--frost:#5fd0e8;--radius:16px;--blur:0px;
}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;font-family:var(--ui);color:var(--fg);background:var(--bg) fixed;
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.s12{width:12px;height:12px}.s14{width:14px;height:14px}.s20{width:20px;height:20px}
.s24{width:24px;height:24px}.s40{width:40px;height:40px}
:focus-visible{outline:2px solid var(--heat);outline-offset:2px}

/* ---------- header ---------- */
header{position:relative;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:10px 20px}
.hbar{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand .logo{width:32px;height:32px;border-radius:12px;border:1px solid var(--border);background:var(--elev);
  color:var(--heat);display:flex;align-items:center;justify-content:center}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.strip{display:none;align-items:center;gap:20px;font-size:12px;flex:none;white-space:nowrap}
.strip>div{display:flex;align-items:center;gap:8px}
.strip .sep{width:1px;height:16px;background:var(--border)}
.strip b{font-weight:600}
.ctrls{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:flex;align-items:center;gap:2px;padding:2px;border-radius:12px;border:1px solid var(--border);background:var(--elev)}
.seg button{border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg)}
.seg.themes button[aria-pressed=true]{background:var(--heat);color:#16171b}
.seg button:disabled{opacity:.45;cursor:not-allowed}
#themeSel{display:none;min-height:36px;border-radius:12px;border:1px solid var(--border);background:var(--elev);
  padding:0 10px;font-size:12px;font-weight:600}
#themeSel option{background:#1f2025;color:#ececf1}

/* ---------- layout ---------- */
main{position:relative;z-index:10;max-width:1440px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col.zones{gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:16px}
[data-theme=smartiva-glass] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px -22px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.tiny{font-size:11px;color:var(--muted)}
.ttl{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.ttl .ic{color:var(--heat)}
.split{border-top:1px solid var(--border);margin-top:16px;padding-top:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv .k{font-size:11px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:4px}
.kv .v{margin-top:2px;font-weight:700;font-size:12px}
.kv .v.big{font-size:16px}

/* clock */
.clock{margin-top:8px;display:flex;align-items:baseline;gap:6px}
.clock .hm{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.clock .ss{font-size:16px;font-weight:500;color:var(--muted)}

/* weather */
.wx-now{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wx-now .l{display:flex;align-items:center;gap:12px}
.wx-now .t{font-size:30px;font-weight:700;line-height:1}
.wx-now .r{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.wx-now .r div{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.city{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.city .ic{color:var(--heat)}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--elev);
  display:flex;align-items:center;justify-content:center}
.fc{display:flex;flex-direction:column;align-items:center;text-align:center}
.fc .d{font-size:11px;font-weight:600;color:var(--muted)}
.fc .ic{margin:6px 0}
.fc .t{font-size:12px;font-weight:600}
.fc .t span{margin-left:4px;font-weight:400;color:var(--muted)}

/* boiler */
.boiler .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.boiler .who{display:flex;align-items:center;gap:12px;min-width:0}
.flamebox{width:48px;height:48px;border-radius:16px;border:1px solid var(--border);background:var(--elev);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--idle)}
.boiler.on .flamebox{border-color:var(--heat);color:var(--heat);box-shadow:0 0 24px -4px var(--glow)}
.boiler .state{font-size:16px;font-weight:700}
.boiler.on .state{color:var(--heat)}
.boiler .anti{text-align:right;flex:none}
.boiler .anti .v{font-size:14px;font-weight:700;color:var(--ok)}
.boiler .anti .v.wait{color:var(--warn)}

/* gas */
.gasrate{margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.gasrate .v{font-size:14px;font-weight:700;color:var(--heat)}
.gasrate .lbl .ic{color:var(--heat)}

/* ---------- zone card ---------- */
.zone{padding:0;position:relative;overflow:hidden;--acc:var(--idle)}
.zone.heating{box-shadow:0 8px 32px -12px var(--glow)}
[data-theme=smartiva-glass] .zone.heating{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 32px -12px var(--glow)}
.wave{display:none;pointer-events:none;position:absolute;left:0;right:0;bottom:0;height:56px;overflow:hidden;opacity:.45}
.zone.heating .wave{display:block}
.wave svg{height:100%;width:200%;display:block;animation:wave 9s linear infinite}
.zhead{position:relative;z-index:1;display:flex;width:100%;min-height:96px;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px;text-align:left}
.zhead .l{display:flex;align-items:center;gap:14px;min-width:0}
.ring{transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:4.5}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .22s cubic-bezier(.16,1,.3,1)}
.zname{font-size:18px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zmeta{margin-top:2px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;font-variant-numeric:tabular-nums}
.zstat{margin-top:6px;font-size:12px;font-weight:600;color:var(--acc);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.zhead .r{display:flex;align-items:center;gap:12px;flex:none}
.ztemp{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.025em}
.deg{font-size:18px;vertical-align:top;margin-left:2px;color:var(--muted)}
.chev{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.zbody{position:relative;z-index:1;border-top:1px solid var(--border);padding:16px 16px 20px;display:flex;flex-direction:column;gap:16px}

.winbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:12px;background:var(--elev);padding:10px 14px}
.winbar[hidden]{display:none}
.winbar .l{display:flex;align-items:center;gap:12px;min-width:0}
.radar{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--warn)}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--warn);animation:radar 2s cubic-bezier(.16,1,.3,1) infinite}
.radar i+i{border-width:1px;animation-delay:.7s}
.winbar .t{font-size:14px;font-weight:700;color:var(--warn)}
.winbar .s{font-size:12px;color:var(--muted)}
.winbar button{min-height:40px;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;white-space:nowrap;
  background:var(--warn);color:#16171b;flex:none}

.dialwrap{display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none}
.dial{position:relative;width:268px;height:268px}
.dial svg{width:100%;height:100%;overflow:visible;touch-action:none;cursor:pointer;display:block}
.dial .track{fill:none;stroke:var(--border);stroke-width:11;stroke-linecap:round}
.dial .arc{fill:none;stroke-width:11;stroke-linecap:round}
.dial .tick{stroke:var(--border);stroke-width:1.2;stroke-linecap:round;opacity:.7}
.dial .tick.on{stroke:var(--acc);stroke-width:1.6;opacity:.9}
.dial text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.dial .cur{fill:var(--fg);opacity:.85}
.dial .thumb{fill:var(--surface);stroke:var(--acc);stroke-width:4}
.readout{pointer-events:none;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px}
.readout .a{font-size:11px;font-weight:500;letter-spacing:.025em;color:var(--muted)}
.readout .big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.025em}
.readout .big .deg{font-size:20px}
.readout .tg{margin-top:6px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.readout .tg b{color:var(--acc);font-weight:600}
.readout .eta{margin-top:2px;font-size:12px;font-weight:500;color:var(--acc)}
.stepper{margin-top:4px;display:flex;align-items:center;gap:16px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--elev);
  display:flex;align-items:center;justify-content:center}
.stepper .mid{min-width:88px;text-align:center}
.stepper .mid b{display:block;font-size:16px;font-weight:700}
.presets{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.presets button{min-height:40px;border-radius:12px;border:1px solid var(--border);background:var(--elev);
  padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap;transition:background .15s}
.presets button.on{background:var(--heat);border-color:transparent;color:#16171b}
.presets button.on.frost{background:var(--frost)}

/* ---------- charts ---------- */
.chartbox{border-top:1px solid var(--border);padding-top:12px}
.chead{margin-bottom:8px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block}
.chart{width:100%}
.chart svg{display:block}
.chart .ax{font-size:10px;fill:var(--muted);font-family:var(--ui)}
.chart .gl{stroke:var(--border);stroke-dasharray:3 3}

/* ---------- system state ---------- */
.dtc li{padding:10px 0}
.dtc li+li{border-top:1px solid var(--border)}
.dtc li:first-child{padding-top:0}.dtc li:last-child{padding-bottom:0}
.dtc .code{font-size:12px;font-weight:700}
.dtc .name{font-size:12px;font-weight:600}
.dtc p{margin-top:4px;font-size:12px;color:var(--muted)}

@keyframes wave{to{transform:translateX(-50%)}}
@keyframes radar{0%{transform:scale(.85);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1) translateY(0);opacity:.95}50%{transform:scale(1.06) translateY(-1px);opacity:1}}
.flick{animation:flick 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.wave svg,.radar i,.flick{animation:none!important}}

@media (min-width:1024px){.grid{grid-template-columns:1fr 1.6fr 1fr;align-items:start}}
@media (min-width:1280px){.readout .big{font-size:62px}}
@media (min-width:1536px){.strip{display:flex}}
@media (max-width:1279px){.seg.themes button{padding:6px 8px;font-size:11px}}
@media (max-width:1023px){.seg.themes{display:none}#themeSel{display:block}}
@media (max-width:767px){
  header{padding:10px 12px}main{padding:12px}.hbar{flex-wrap:wrap}
  .brand h1{font-size:14px}.dial{width:244px;height:244px}.readout .big{font-size:48px}
  .zname{font-size:16px}.stepper button{width:44px;height:44px}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand"><div class="logo" id="logo"></div><h1>Smart Home Heating</h1></div>
    <div class="strip" id="strip"></div>
    <div class="ctrls">
      <div class="seg themes" id="themeBtns" role="group" aria-label="Selector temă"></div>
      <select id="themeSel" aria-label="Temă vizuală"></select>
      <div class="seg" role="group" aria-label="Sursă date">
        <button type="button" aria-pressed="true">Mock</button>
        <button type="button" aria-pressed="false" disabled title="Se leagă la placă în pasul următor">Date Live</button>
      </div>
      <div class="seg" id="viewBtns"></div>
    </div>
  </div>
</header>

<main>
  <div class="grid">
    <div class="col" id="left"></div>
    <div class="col zones" id="zones"></div>
    <div class="col" id="right"></div>
  </div>
</main>

<script>
'use strict';
/* ================= icons (Lucide, inline) ================= */
const I={
thermo:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
pause:'<circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
down:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m18 15-6-6-6 6"/>',
refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
drops:'<path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>',
wind:'<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>',
fuel:'<line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>',
activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
snow:'<line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/>',
minus:'<path d="M5 12h14"/>',plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
timer:'<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>',
cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
rain:'<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>',
csnow:'<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
csun:'<path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
};
const ic=(n,c='',st='')=>`<svg class="ic ${c}"${st?` style="${st}"`:''} viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
function wmo(code,day,c){
  const k=(n,col)=>ic(n,c,`color:var(--${col})`);
  if(code===0)return day?k('sun','warn'):k('moon','idle');
  if(code<=2)return day?k('csun','warn'):k('moon','idle');
  if((code>=51&&code<=67)||(code>=80&&code<=82))return k('rain','idle');
  if((code>=71&&code<=77)||code===85||code===86)return k('csnow','frost');
  return k('cloud','muted');

function hist(base,target,shift,heating){
  const a=[];
  for(let h=0;h<24;h++){
    const outdoor=+(5.2+3.4*Math.sin(((h-9)/24)*Math.PI*2)).toFixed(1);
    const tg=+(target+(h<5?-.8:0)).toFixed(1);
    const wave=Math.sin(((h+shift)/6)*Math.PI)*.35;
    const last=h===23, temp=last?base:+(tg-.15+wave).toFixed(1);
    let valve=0;
    if(last&&heating)valve=.92;
    else if(temp<tg-.05||(h>=5&&h<=8))valve=+Math.min(1,.45+Math.abs(tg-temp)*.9).toFixed(2);
    a.push({temp,target:tg,outdoor,valve});
  }
  return a;
}

function status(z){
  const pct=Math.round((Math.min(MAX,Math.max(MIN,z.cur))-MIN)/(MAX-MIN)*100);
  if(!z.online)return{s:'sensor-error',t:'Senzor fără semnal',pct};
  if(z.window)return{s:'window',t:'Fereastră deschisă',pct};
  if(z.target<=8)return{s:'frost',t:z.valve?'Anti-îngheț activ':'Anti-îngheț',pct};
  if(z.valve)return{s:'heating',t:'Încălzire activă',pct};
  return{s:'idle',t:'La țintă',pct};
}
function heatUp(z){
  const d=z.target-z.cur;
  if(d<=.05)return{need:false,t:'La temperatură'};
  const slope=Math.max(.35,z.k-Math.max(0,z.cur-S.weather.temp)*.015);
  return{need:true,t:'~'+Math.max(3,Math.round(d/slope*60))+' min până la țintă'};
}
function evalValves(){
  S.zones.forEach(z=>{
    if(!z.online||z.window){z.valve=false;return}
    const d=z.target-z.cur;
    if(d>.2)z.valve=true;else if(d<=0)z.valve=false;
  });
  const any=S.zones.some(z=>z.valve),b=S.boiler;
  if(any&&!b.on&&b.anti<=0){b.on=true;b.overrun=0}
  else if(!any&&b.on){b.on=false;b.anti=180;b.overrun=180}
}

function smooth(p){
  let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
  for(let i=0;i<p.length-1;i++){
    const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
  }
  return d;
}
function drawChart(el,o){
  const W=el.clientWidth||300,H=o.h,L=34,R=6,T=6,B=18,pw=W-L-R,ph=H-T-B,n=24;
  const y=v=>T+ph-(v/28)*ph, x=o.bars?i=>L+(i+.5)*pw/n:i=>L+i*pw/(n-1);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">`;
  [0,7,14,21,28].forEach(v=>{
    if(o.grid)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`;
    s+=`<text class="ax" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}°</text>`;
  });
  [0,6,12,18].forEach(i=>s+=`<text class="ax" x="${x(i)}" y="${H-4}" text-anchor="middle">${p2(i)}:00</text>`);
  if(o.bars)o.bars.forEach((v,i)=>{if(v>0){const bh=v/4*ph;
    s+=`<rect x="${x(i)-3}" y="${T+ph-bh}" width="6" height="${bh}" rx="2" style="fill:var(--heat);opacity:.55"/>`}});
  o.lines.forEach(l=>{
    const pts=l.v.map((v,i)=>[x(i),y(v)]);let d;
    if(l.step){d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=` H${pts[i][0]} V${pts[i][1]}`}
    else d=smooth(pts);
    s+=`<path d="${d}" fill="none" style="stroke:var(--${l.c});stroke-width:${l.w};opacity:${l.o||1}"${l.dash?` stroke-dasharray="${l.dash}"`:''}/>`;
  });
  el.innerHTML=s+'</svg>';
}

          <div class="mid"><span class="tiny">Reglaj fin</span><b class="mono" data-k="fine"></b></div>
          <button type="button" data-act="step" data-d="0.5" aria-label="Crește temperatura țintă pentru ${z.name}">${ic('plus','s20')}</button></div></div>
      <div class="presets">${PRESETS.map(p=>`<button type="button" class="${p[0]==='frost'?'frost':''}" data-act="preset" data-t="${p[2]}">${p[1]} ${p[2]%1?p[2].toFixed(1):p[2]+(p[0]==='frost'?'':'.0')}°</button>`).join('')}</div>
      <div class="chartbox"><div class="row chead"><span class="lbl">Istoric 24h · ${z.name}</span>
        <div class="legend"><span><i style="width:12px;height:2px;background:var(--fg)"></i>Zonă</span>
        <span><i style="width:12px;border-top:1px dashed var(--heat)"></i>Țintă</span>
        <span><i style="width:6px;height:8px;border-radius:2px;background:var(--heat)"></i>Ardere</span></div></div>
        <div class="chart" id="zchart" style="height:116px"></div></div>
    </div>`:''}
    </section>`}).join('');
  S.zones.forEach(paintZone);
}
function paintZone(z){
  const el=document.querySelector(`[data-z="${z.id}"]`),q=k=>el.querySelector(`[data-k="${k}"]`),st=status(z),hu=heatUp(z);
  el.style.setProperty('--acc',`var(--${COL[st.s]})`);
  el.classList.toggle('heating',z.valve);
  q('ring').style.strokeDashoffset=149.23*(1-Math.max(4,Math.min(100,st.pct))/100);
  q('mtarget').textContent='Țintă '+f1(z.target)+'°C';
  q('stat').innerHTML=ic(SICON[st.s],'s14')+`<span>${st.t}</span>`+(z.valve&&hu.need?`<span aria-hidden="true">·</span><span class="mono">${hu.t}</span>`:'');
  el.querySelector('.zhead').setAttribute('aria-label',`${z.name}, ${f1(z.cur)} grade Celsius, ${st.t}`);
  if(z.id!==expanded)return;
  const tr=ratio(z.target),ta=225+tr*270,tp=polar(116,ta),cp=polar(116,225+ratio(z.cur)*270);
  q('arc').setAttribute('d',tr>.005?arc(225,ta):'');
  q('thumb').setAttribute('cx',tp[0]);q('thumb').setAttribute('cy',tp[1]);
  q('cur').setAttribute('cx',cp[0]);q('cur').setAttribute('cy',cp[1]);
  q('ticks').querySelectorAll('line').forEach((l,i)=>l.classList.toggle('on',i/45<=tr));
  const d=q('dial');d.setAttribute('aria-valuenow',z.target);d.setAttribute('aria-valuetext',f1(z.target)+' grade Celsius');
  q('rtarget').textContent=f1(z.target)+'°C';q('fine').textContent=f1(z.target)+' °C';
  q('eta').textContent=z.window?'Încălzire suspendată':!z.online?'Așteaptă senzorul':hu.t;
  q('win').hidden=!z.window;
  el.querySelectorAll('[data-act=preset]').forEach(b=>b.classList.toggle('on',Math.abs(z.target-b.dataset.t)<.05&&!z.window));
}
function setTarget(z,t){
  z.target=+Math.max(MIN,Math.min(MAX,t)).toFixed(1);
  evalValves();S.zones.forEach(paintZone);paintLive();paintCharts();
}

/* ================= events ================= */
let drag=null;
function fromPointer(e){
  const r=drag.rect,px=e.clientX-(r.left+r.width/2),py=e.clientY-(r.top+r.height/2);
  let a=Math.atan2(px,-py)*180/Math.PI;if(a<0)a+=360;
  let rel=a-225;if(rel<0)rel+=360;
  if(rel>270)rel=rel>315?0:270;
  setTarget(drag.z,Math.round((MIN+rel/270*(MAX-MIN))*2)/2);
}
const zonesEl=$('#zones');
zonesEl.addEventListener('click',e=>{
  const sec=e.target.closest('[data-z]');if(!sec)return;
  const z=S.zones.find(z=>z.id===sec.dataset.z),act=e.target.closest('[data-act]');
  if(e.target.closest('.zhead')){expanded=expanded===z.id?null:z.id;buildZones();paintCharts();return}
  if(!act)return;
  if(act.dataset.act==='step')setTarget(z,z.target+ +act.dataset.d);
  if(act.dataset.act==='preset')setTarget(z,+act.dataset.t);
  if(act.dataset.act==='resume'){z.window=false;setTarget(z,z.target)}
});
zonesEl.addEventListener('pointerdown',e=>{
  const d=e.target.closest('[data-k=dial]');if(!d)return;
  drag={z:S.zones.find(z=>z.id===d.closest('[data-z]').dataset.z),rect:d.getBoundingClientRect()};
  d.setPointerCapture(e.pointerId);fromPointer(e);
});
zonesEl.addEventListener('pointermove',e=>{if(drag)fromPointer(e)});
['pointerup','pointercancel'].forEach(t=>zonesEl.addEventListener(t,()=>{drag=null}));
zonesEl.addEventListener('keydown',e=>{
  const d=e.target.closest('[data-k=dial]');if(!d)return;
  const z=S.zones.find(z=>z.id===d.closest('[data-z]').dataset.z);
  if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();setTarget(z,z.target+.5)}
  if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();setTarget(z,z.target-.5)}
});

/* ================= start ================= */
$('#themeBtns').innerHTML=Object.keys(THEMES).map(id=>`<button type="button" data-t="${id}">${THEMES[id].label}</button>`).join('')
  +'<button type="button" disabled title="Se face separat, la sfârșit">Meteo Dinamic</button>';
$('#themeSel').innerHTML=Object.keys(THEMES).map(id=>`<option value="${id}">${THEMES[id].label}</option>`).join('');
$('#themeBtns').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)applyTheme(b.dataset.t)});
$('#themeSel').addEventListener('change',e=>applyTheme(e.target.value));
applyTheme(themeId);
evalValves();buildSides();buildZones();paintLive();paintCharts();
setInterval(()=>{const b=S.boiler;if(b.anti>0)b.anti--;if(b.overrun>0)b.overrun--;evalValves();paintLive()},1000);
let rz;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(paintCharts)});
</script>
</body>
</html>
