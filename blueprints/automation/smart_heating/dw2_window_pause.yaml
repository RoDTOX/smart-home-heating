blueprint:
  name: "Smart Heating - Door/Window Pause Automation (Sonoff DW2)"
  description: >
    Automatically suspends underfloor heating when a door or window (such as Sonoff DW2) is opened,
    and resumes heating when closed.
  domain: automation
  input:
    door_window_sensor:
      name: Door or Window Sensor
      description: The contact sensor entity (e.g. binary_sensor.sonoff_dw2_door).
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - door
            - window
            - opening
    target_zone_id:
      name: Heating Zone ID
      description: The Smart Heating zone ID corresponding to this room (1=Living, 2=Kids, 3=Adults).
      default: 1
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box
    open_delay:
      name: Delay before pausing heating
      description: Time the window must remain open before suspending heating (avoids triggering on brief openings).
      default: 15
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: seconds

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input door_window_sensor
    to: "on"
    for:
      seconds: !input open_delay
    id: opened
  - platform: state
    entity_id: !input door_window_sensor
    to: "off"
    id: closed

action:
  - choose:
      - conditions:
          - condition: trigger
            id: opened
        sequence:
          - service: smart_heating.set_window_pause
            data:
              zone_id: !input target_zone_id
              duration_sec: 1800
      - conditions:
          - condition: trigger
            id: closed
        sequence:
          - service: smart_heating.clear_window_pause
            data:
              zone_id: !input target_zone_id
